name = "zhentigongfang"
main = "src/index.js"
compatibility_date = "2026-07-01"
routes = [
  { pattern = "zhenti.zalize.com", custom_domain = true }
]

# 自身 service binding：生成任务自链接力（不依赖客户端轮询）
[[services]]
binding = "SELF"
service = "zhentigongfang"

[[d1_databases]]
binding = "DB"
database_name = "zhentigongfang"
database_id = "152f4fee-d77d-400d-a994-7db3dcfa5430"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "362cc844258342fcae0e7cb96937bd6e"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
