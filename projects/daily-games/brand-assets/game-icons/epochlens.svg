<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="EpochLens">
  <!-- film frame holding a pocket watch · accent #a8842c -->
  <rect x="6" y="8" width="36" height="32" rx="4" fill="#f5eedb" stroke="#a8842c" stroke-width="2.5"/>
  <!-- sprocket holes: 3 top, 3 bottom -->
  <g fill="#a8842c">
    <rect x="12" y="11" width="4" height="3" rx="1"/><rect x="22" y="11" width="4" height="3" rx="1"/><rect x="32" y="11" width="4" height="3" rx="1"/>
    <rect x="12" y="34" width="4" height="3" rx="1"/><rect x="22" y="34" width="4" height="3" rx="1"/><rect x="32" y="34" width="4" height="3" rx="1"/>
  </g>
  <!-- pocket watch, hands pointing to an unknown hour -->
  <circle cx="24" cy="25" r="7.5" fill="#a8842c"/>
  <rect x="22.5" y="15.5" width="3" height="3" rx="1" fill="#6b5316"/>
  <line x1="24" y1="25" x2="24" y2="20.5" stroke="#f5eedb" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="25" x2="27.5" y2="27" stroke="#f5eedb" stroke-width="2" stroke-linecap="round"/>
  <circle cx="27" cy="21.5" r="1.4" fill="#ffffff"/>
</svg>
