<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 真题工坊 Logo 精修版：品牌蓝渐变圆角方块 + 白「真」+ 右下角判对勾角标（呼应"判分"） -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D7FFF"/>
      <stop offset="1" stop-color="#2456C7"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#g)"/>
  <text x="243" y="278" text-anchor="middle" dominant-baseline="central"
        font-family="'PingFang SC','HarmonyOS Sans','Microsoft YaHei',sans-serif"
        font-size="288" font-weight="700" fill="#FFFFFF">真</text>
  <circle cx="392" cy="392" r="76" fill="#00B578" stroke="#FFFFFF" stroke-width="16"/>
  <path d="M358 392 l24 24 48 -48" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
