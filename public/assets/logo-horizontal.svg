<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <!-- 横版组合：mark 40px 缩放 + 字标 + 副标语 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D7FFF"/>
      <stop offset="1" stop-color="#2456C7"/>
    </linearGradient>
  </defs>
  <g transform="translate(16,16)">
    <rect width="128" height="128" rx="30" fill="url(#g)"/>
    <text x="60" y="70" text-anchor="middle" dominant-baseline="central"
          font-family="'PingFang SC','HarmonyOS Sans','Microsoft YaHei',sans-serif"
          font-size="78" font-weight="700" fill="#FFFFFF">真</text>
    <circle cx="102" cy="102" r="21" fill="#00B578" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M92 102 l7 7 14 -14" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="172" y="82" font-family="'PingFang SC','HarmonyOS Sans','Microsoft YaHei',sans-serif"
        font-size="58" font-weight="700" fill="#1E2330">真题工坊</text>
  <text x="174" y="126" font-family="'PingFang SC','HarmonyOS Sans','Microsoft YaHei',sans-serif"
        font-size="26" fill="#9AA3B2">把复习资料变成一场仿真模拟考</text>
</svg>
