<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let TOKEN = localStorage.getItem('zt_token') || '';
let ME = null;

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch('/api' + path, opts);
  const data = await r.json().catch(() => ({ error: '网络错误' }));
  if (!r.ok) { const e = new Error(data.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return data;
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const DISPUTE_NOTE='（注：该题各机构答案存在分歧，以官方《考试分析》为准）';
function fmtAnalysis(a){ a=a||''; if(a.startsWith(DISPUTE_NOTE)) return `<span class="inline-block mb-2 px-2 py-1 rounded-lg bg-warn-50 text-warn-700 text-xs">该题各机构答案存在分歧，以官方《考试分析》为准</span><br>`+esc(a.slice(DISPUTE_NOTE.length).replace(/^\n/,'')); return esc(a); }
let CURVIEW = '';
const LOGO = `<span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-brand-500"><svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M7 3h7l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/></svg></span><span class="font-bold tracking-tight">真题工坊</span>`;
function navLink(label, act, key) {
  const on = CURVIEW === key;
  return `<button onclick="${act}" class="${on ? 'text-brand-600 font-semibold' : 'text-slate-500 hover:text-brand-600'}">${label}</button>`;
}
const TAB_ICONS = {
  home: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V10z"/></svg>',
  wrong: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h4M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/></svg>',
  account: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 8a7 7 0 0 1 14 0"/></svg>'
};
function tabItem(label, act, key) {
  const on = CURVIEW === key;
  return `<button onclick="${act}" class="flex flex-col items-center justify-center gap-0.5 ${on ? 'text-brand-600' : 'text-ink-3'}">${TAB_ICONS[key]}<span class="text-[11px] ${on ? 'font-semibold' : 'font-medium'}">${label}</span></button>`;
}
function bottomTab() {
  if (!ME) return '';
  return `<nav class="sm:hidden fixed bottom-0 inset-x-0 z-40 h-14 bg-white border-t border-black/5 grid grid-cols-3" style="padding-bottom:env(safe-area-inset-bottom)">
    ${tabItem('工作台','viewHome()','home')}${tabItem('错题本','viewWrong()','wrong')}${tabItem('我的','viewAccount()','account')}
  </nav>`;
}
function nav() {
  return `<header class="flex items-center justify-between py-5">
    <a href="/" class="flex items-center gap-2 text-lg">${LOGO}</a>
    <div class="hidden sm:flex items-center gap-4 text-sm">
      ${ME ? navLink('工作台','viewHome()','home') + navLink('错题本','viewWrong()','wrong') + navLink((ME.pro?'👑':'')+'我的','viewAccount()','account') : ''}
    </div></header>` + bottomTab();
}
// 答题页导航：离开前二次确认
function navExam() {
  return `<header class="flex items-center justify-between py-5">
    <button onclick="leaveExam(viewHome)" class="flex items-center gap-2 text-lg">${LOGO}</button>
    <div class="flex items-center gap-4 text-sm">
      <button onclick="leaveExam(viewHome)" class="text-slate-500 hover:text-brand-600">工作台</button>
      <button onclick="leaveExam(viewWrong)" class="text-slate-500 hover:text-brand-600">错题本</button>
      <button onclick="leaveExam(viewAccount)" class="text-slate-500 hover:text-brand-600">我的</button>
    </div></header>`;
}
function toast(msg, ok=false) {
  const t = document.createElement('div');
  const lift = document.getElementById('pwaBar') ? 'bottom-48 sm:bottom-32' : (typeof EXAM !== 'undefined' && EXAM ? 'bottom-24' : 'bottom-20 sm:bottom-6');
  t.className = `fixed ${lift} left-1/2 -translate-x-1/2 w-max max-w-[92vw] px-4 py-2.5 rounded-xl text-white text-sm shadow-lg z-50 ${ok?'bg-emerald-600':'bg-slate-800'}`;
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ---------- auth ----------
function viewAuth() {
  CURVIEW = 'auth';
  app.innerHTML = nav() + `
  <div class="max-w-sm mx-auto mt-10 bg-white rounded-2xl border border-black/5 shadow-card p-7">
    <h1 class="text-xl font-bold text-center" id="authTitle">登录真题工坊</h1>
    <div class="mt-5 space-y-3">
      <input id="email" type="email" placeholder="邮箱" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500">
      <input id="password" type="password" placeholder="密码（至少 6 位）" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500">
      <button id="authBtn" class="w-full py-3 rounded-xl bg-brand-500 text-white font-semibold">登录</button>
      <p class="text-center text-sm text-slate-500"><span id="switchHint">还没有账号？</span><button id="switchBtn" class="text-brand-600 font-medium">注册</button></p>
      <p id="forgotRow" class="text-center"><button id="forgotBtn" class="text-xs text-slate-400 hover:text-brand-600 underline underline-offset-2">忘记密码？</button></p>
    </div></div>`;
  let mode = 'login';
  const applyMode = () => {
    $('#authTitle').textContent = mode === 'login' ? '登录真题工坊' : '注册账号';
    $('#authBtn').textContent = mode === 'login' ? '登录' : '注册';
    $('#switchHint').textContent = mode === 'login' ? '还没有账号？' : '已有账号？';
    $('#switchBtn').textContent = mode === 'login' ? '注册' : '登录';
    const fr = $('#forgotRow'); if (fr) fr.classList.toggle('hidden', mode !== 'login');
    const ih = $('#inviteHint'); if (ih) ih.classList.toggle('hidden', mode !== 'register');
  };
  const resetM = location.hash.match(/^#reset-([0-9a-f]{48})$/);
  if (resetM) return viewReset(resetM[1]);
  const regM = location.hash.match(/^#reg(?:-(Z[0-9A-Za-z]{1,8}))?$/);
  if (regM) {
    mode = 'register'; applyMode();
    if (regM[1]) { try { localStorage.setItem('zt_invite', regM[1]); } catch (e) {} }
  }
  // 从公开真题库等带意图链接进来的新用户：默认注册模式，注册/登录后直达目标页
  if (/^#real/.test(location.hash)) { mode = 'register'; applyMode(); }
  let inviteCode = '';
  try { inviteCode = localStorage.getItem('zt_invite') || ''; } catch (e) {}
  if (inviteCode) $('#authTitle').insertAdjacentHTML('afterend', `<p id="inviteHint" class="mt-2 text-center text-xs text-emerald-600 ${mode === 'register' ? '' : 'hidden'}">使用研友邀请链接注册，成功后双方各得 3 天会员</p>`);
  $('#switchBtn').onclick = () => { mode = mode === 'login' ? 'register' : 'login'; applyMode(); };
  $('#forgotBtn').onclick = async () => {
    const email = $('#email').value.trim();
    if (!email) return toast('请先在上方填写注册邮箱，再点「忘记密码」');
    try {
      $('#forgotBtn').textContent = '发送中…';
      await api('/forgot', { method: 'POST', body: JSON.stringify({ email }) });
      $('#forgotBtn').textContent = '重置邮件已发送';
      toast('如该邮箱已注册，重置链接已发至邮箱（30 分钟内有效）', true);
    } catch (e) { toast(e.message); $('#forgotBtn').textContent = '忘记密码？'; }
  };
  $('#authBtn').onclick = async () => {
    try {
      $('#authBtn').textContent = '请稍候…';
      const payload = { email: $('#email').value.trim(), password: $('#password').value };
      if (mode === 'register' && inviteCode) payload.invite = inviteCode;
      if (mode === 'register' && /^#real/.test(location.hash)) { payload.src = 'seo'; payload.si = location.hash.slice(1).split('/')[0]; }
      const d = await api('/' + mode, { method: 'POST', body: JSON.stringify(payload) });
      TOKEN = d.token; localStorage.setItem('zt_token', TOKEN);
      if (mode === 'register' && payload.invite) {
        try { localStorage.removeItem('zt_invite'); } catch (e) {}
        if (d.invite_bonus) toast('邀请奖励已到账：3 天会员体验', true);
        else toast('本次注册未发放邀请奖励，注册已成功');
      }
      await loadMe(); if (/^#real/.test(location.hash)) routeByHash(); else viewHome();
    } catch (e) { toast(e.message); $('#authBtn').textContent = mode === 'login' ? '登录' : '注册'; }
  };
}
function viewReset(token) {
  CURVIEW = 'auth';
  app.innerHTML = nav() + `
  <div class="max-w-sm mx-auto mt-10 bg-white rounded-2xl border border-black/5 shadow-card p-7">
    <h1 class="text-xl font-bold text-center">设置新密码</h1>
    <div class="mt-5 space-y-3">
      <input id="newPw" type="password" autocomplete="new-password" placeholder="新密码（至少 6 位）" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500">
      <button id="resetBtn" class="w-full py-3 rounded-xl bg-brand-500 text-white font-semibold">确认重置</button>
      <p class="text-center text-xs text-slate-400">重置后请用新密码登录</p>
    </div></div>`;
  $('#resetBtn').onclick = async () => {
    try {
      $('#resetBtn').textContent = '请稍候…';
      await api('/reset', { method: 'POST', body: JSON.stringify({ token, password: $('#newPw').value }) });
      toast('密码已重置，请用新密码登录', true);
      location.hash = ''; viewAuth();
    } catch (e) { toast(e.message); $('#resetBtn').textContent = '确认重置'; }
  };
}
async function loadMe() { const d = await api('/me'); ME = { ...d.user, pro: d.pro, quota: d.quota, invite_code: d.invite_code, invited_count: d.invited_count, pay_enabled: d.pay_enabled }; }
function fmtDur(s) { s = s || 0; return `${Math.floor(s/60)} 分 ${s%60} 秒`; }

// 应用内确认弹窗（替代原生 confirm）
function askConfirm(msg, okText = '确定', cancelText = '取消') {
  if (document.querySelector('.app-confirm')) return Promise.resolve(false);
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'app-confirm fixed inset-0 z-50 grid place-items-center bg-slate-900/40 p-4';
    wrap.innerHTML = `<div class="w-full max-w-sm bg-white rounded-2xl p-5 shadow-xl">
      <p class="text-sm text-slate-700 leading-relaxed">${msg}</p>
      <div class="mt-4 flex gap-2 justify-end">
        <button data-act="no" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 text-sm">${cancelText}</button>
        <button data-act="ok" class="px-4 py-2 rounded-xl bg-brand-500 text-white text-sm font-medium">${okText}</button>
      </div></div>`;
    const done = v => { wrap.remove(); resolve(v); };
    wrap.querySelector('[data-act=ok]').onclick = () => done(true);
    wrap.querySelector('[data-act=no]').onclick = () => done(false);
    wrap.onclick = e => { if (e.target === wrap) done(false); };
    document.body.appendChild(wrap);
    wrap.querySelector('[data-act=ok]').focus();
  });
}

// 一键每日一卷：后端自动从未考过的考点组卷
async function dailyPaper(btn, quick) {
  const orig = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 组卷中…'; }
  try {
    const d = await api('/papers/daily', { method: 'POST', body: JSON.stringify(quick ? { quick: true } : {}) });
    pollPaper(d.id);
  } catch (e) {
    toast(e.message);
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}

// 考研初试倒计时：每年 12 月 26 日前最近的周六
function examDays() {
  const now = new Date();
  const examDate = y => { const d = new Date(y, 11, 26); while (d.getDay() !== 6) d.setDate(d.getDate() - 1); return d; };
  let ed = examDate(now.getFullYear());
  if (ed < now) ed = examDate(now.getFullYear() + 1);
  return Math.ceil((ed - now) / 86400000);
}
// 今日任务卡：重练错题 + 完成一卷 + 攻克新考点
function localDay(ts) { return new Date(ts.replace(' ', 'T') + 'Z').toLocaleDateString(); }
function fmtDate(ts) { const d = new Date(ts.replace(' ', 'T') + 'Z'); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
// 连续学习天数：从今天（或昨天）往前数连续有作答的天数
function studyDays() {
  return new Set((window.__dayTs && window.__dayTs.length ? window.__dayTs : (window.__attempts || []).map(a => a.created_at)).map(localDay));
}
function calcStreak() {
  const days = studyDays();
  if (!days.size) return 0;
  const d = new Date();
  if (!days.has(d.toLocaleDateString())) {
    d.setDate(d.getDate() - 1);
    if (!days.has(d.toLocaleDateString())) return 0;
  }
  let n = 0;
  while (days.has(d.toLocaleDateString())) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
// 打卡日历弹层：最近 4 周，有作答的日子点亮
function showStreakCal() {
  const days = studyDays();
  const cells = [];
  const d = new Date(); d.setDate(d.getDate() - 27);
  const WD = ['日', '一', '二', '三', '四', '五', '六'];
  const head = [];
  for (let i = 0; i < 7; i++) head.push(`<div class="text-center text-[10px] text-slate-400">${WD[(d.getDay() + i) % 7]}</div>`);
  for (let i = 0; i < 28; i++) {
    const key = d.toLocaleDateString(), hit = days.has(key), isToday = i === 27;
    const label = d.getDate() === 1 || i === 0 ? `<span class="text-[9px]">${d.getMonth() + 1}月${d.getDate()}日</span>` : d.getDate();
    cells.push(`<div class="h-9 rounded-lg grid place-items-center text-xs ${hit ? 'bg-orange-100 text-orange-600 font-semibold' : 'bg-slate-50 text-slate-400'} ${isToday ? 'ring-2 ring-orange-400' : ''}">${hit ? `<span class="leading-none text-center">🔥<span class="block text-[9px]">${d.getDate()}</span></span>` : label}</div>`);
    d.setDate(d.getDate() + 1);
  }
  const streak = calcStreak();
  const wrap = document.createElement('div');
  wrap.className = 'fixed inset-0 z-50 grid place-items-center bg-slate-900/40 p-4';
  wrap.innerHTML = `<div class="w-full max-w-sm bg-white rounded-2xl p-5 shadow-xl">
    <div class="flex items-center justify-between">
      <p class="font-bold">学习打卡 · 近 4 周</p>
      <span class="text-xs text-orange-600 font-medium">🔥 连续 ${streak} 天</span>
    </div>
    <div class="mt-3 grid grid-cols-7 gap-1.5">${head.join('')}${cells.join('')}</div>
    <p class="mt-3 text-xs text-slate-500">每天完成任意一次作答即算打卡，坚持越久连续天数越高</p>
    <button class="mt-3 w-full py-2.5 rounded-xl bg-slate-100 text-slate-600 text-sm">关闭</button>
  </div>`;
  const onEsc = e => { if (e.key === 'Escape') close(); };
  const close = () => { wrap.remove(); document.removeEventListener('keydown', onEsc); };
  wrap.onclick = e => { if (e.target === wrap) close(); };
  wrap.querySelector('button').onclick = close;
  document.addEventListener('keydown', onEsc);
  document.body.appendChild(wrap);
}
function taskCard(s, mats, papers) {
  window.__attempts = s && s.attempts || [];
  window.__dayTs = s && s.attempt_day_ts || [];
  const today = new Date().toLocaleDateString();
  const todayN = (s && s.attempts || []).filter(a => localDay(a.created_at) === today).length;
  const doneToday = todayN > 0;
  const practiced = parseInt(localStorage.getItem('zt_practice_' + (ME ? ME.id + '_' : '') + today) || '0', 10);
  const wrong = s ? (s.wrong_due ?? s.wrong_count) : 0;
  const wrongTotal = s ? s.wrong_count : 0;
  const uncov = s ? Math.max(0, s.kp_total - s.kp_covered) : 0;
  // 今日基准：当天首次进入时记录已覆盖考点数，当天新覆盖 ≥1 个即算完成
  // 基准同时记录 kp_total：导入新考点库会让覆盖数瞬间跳变，此时重置基准避免「秒完成」误导
  const kpKey = 'zt_kpbase_' + (ME ? ME.id + '_' : '') + today;
  let kpBase = null;
  try { kpBase = JSON.parse(localStorage.getItem(kpKey)); } catch { }
  if (typeof kpBase === 'number') kpBase = { c: kpBase, t: s ? s.kp_total : 0 }; // 兼容旧格式
  if (s && (!kpBase || kpBase.t !== s.kp_total)) { kpBase = { c: s.kp_covered, t: s.kp_total }; localStorage.setItem(kpKey, JSON.stringify(kpBase)); }
  const kpGain = s && kpBase ? Math.max(0, s.kp_covered - kpBase.c) : 0;
  const subjToday = parseInt(localStorage.getItem('zt_subjday_' + (ME ? ME.id + '_' : '') + today) || '0', 10);
  const pending = (papers && papers.papers || []).find(pp => pp.status === 'ready' && pp.last_total == null);
  const items = [
    { done: doneToday, label: doneToday ? `今日已完成 ${todayN} 次作答` : pending ? `<span class="block">继续未答完的</span><span class="block truncate pr-1 text-xs text-slate-500">「${esc((pending.title || '').length > 18 ? (pending.title || '').slice(0, 6) + '…' + (pending.title || '').slice(-5) : pending.title || '')}」</span>` : (mats && mats.materials.length ? '生成并完成一份模拟卷' : '刷一份历年真题整卷，摸清自己的起点'),
      act: doneToday ? '' : pending ? `viewExam(${pending.id})` : (mats && mats.materials.length ? 'dailyPaper(this)' : 'viewReal()'),
      btn: pending ? '去答题' : (mats && mats.materials.length ? '一键每日一卷' : '去刷真题') },
    { done: (s && s.attempts && s.attempts.length > 0) && (wrong === 0 || practiced >= Math.min(wrong, 10)),
      label: (!s || !s.attempts || !s.attempts.length) ? '完成作答后，错题会自动进入错题本' : wrongTotal === 0 ? '错题已全部消灭' : wrong === 0 ? `今日复习已清（${wrongTotal} 道在队列中）` : practiced >= Math.min(wrong, 10) ? `今日已重练 ${practiced} 道错题` : `复习 ${Math.min(wrong, 10)} 道到期错题（今日已练 ${practiced}，${wrong} 道到期）`,

// 冲刺看板：正确率趋势 + 错题/考点入口
function dashCard(s) {
  const atts = s.attempts.slice(-30);
  const last = atts[atts.length - 1];
  const pct = Math.round(last.score / last.total * 100);
  // 按日聚合正确率（最近 12 个有作答的日子）
  const byDay = {};
  for (const a of atts) { const d = localDay(a.created_at); (byDay[d] = byDay[d] || { s: 0, t: 0 }); byDay[d].s += a.score; byDay[d].t += a.total; }
  const days = Object.entries(byDay).slice(-12);
  // 冷启动期（不足 3 天数据）按逐次作答展示，避免单柱抹平当天波动
  const perAttempt = days.length < 3;
  const series = perAttempt
    ? atts.slice(-12).map(a => ({ label: `${a.score}/${a.total}`, pct: Math.round(a.score / a.total * 100) }))
    : days.map(([d, v]) => ({ label: `${d}：${v.s}/${v.t}`, pct: Math.round(v.s / v.t * 100) }));
  const prevPct = series.length > 1 ? series[series.length - 2].pct : null;
  const curPct = series[series.length - 1].pct;
  const delta = prevPct === null || curPct === prevPct ? '' : curPct > prevPct ? `<span class="text-emerald-600">▲ +${curPct - prevPct}%</span>` : `<span class="text-rose-500">▼ ${curPct - prevPct}%</span>`;
  const chart = series.length < 3
    ? `<div class="mt-2 h-12 flex items-center justify-center"><p class="text-xs text-slate-400">再完成 ${3 - series.length} 次作答即可看到趋势</p></div>`
    : `<div class="mt-2 flex items-end gap-1 h-12">${series.map(v => { const h = Math.max(8, v.pct); return `<div title="${v.label}" class="flex-1 max-w-4 rounded-t ${h >= 60 ? 'bg-brand-400' : 'bg-amber-400'}" style="height:${h}%"></div>`; }).join('')}</div>
      <p class="mt-1.5 text-xs text-slate-500">${perAttempt ? `近 ${series.length} 次作答趋势` : `近 ${days.length} 天正确率趋势（按日聚合）`}</p>`;
  const pctCls = pct < 40 ? 'text-rose-500' : pct <= 70 ? 'text-amber-500' : 'text-emerald-600';
  return `<div class="bg-white rounded-2xl border border-black/5 shadow-card p-5">
    <div class="grid sm:grid-cols-3 gap-5">
    <div>
      <p class="text-xs text-slate-400">最近一次正确率 <button onclick="viewHistory()" class="ml-1 text-brand-500 hover:text-brand-600 font-medium">全部成绩 →</button></p>
      <p class="mt-1 text-3xl font-bold font-num ${pctCls}">${pct}<span class="text-base font-medium text-slate-400">%</span> <span class="text-sm font-medium">${delta}</span></p>
      ${chart}
    </div>
    <button onclick="viewWrong()" class="text-left rounded-xl border border-black/5 bg-page p-4 hover:border-brand-300 transition-all">
      <p class="text-xs text-slate-400">今日待复习错题</p>
      <p class="mt-1 text-3xl font-bold font-num ${(s.wrong_due ?? s.wrong_count) ? 'text-rose-500' : 'text-emerald-600'}">${s.wrong_due ?? s.wrong_count}</p>
      <p class="mt-1 text-xs ${(s.wrong_due ?? s.wrong_count) ? 'text-brand-600 font-medium' : 'text-slate-400'}">${(s.wrong_due ?? s.wrong_count) ? '去错题重练 →' : (s.wrong_count ? `今日已清，共 ${s.wrong_count} 道在复习队列` : '全部掌握，棒！')}</p>
    </button>
    <div class="rounded-xl border border-black/5 bg-page p-4">
      <p class="text-xs text-slate-400">考点攻克进度</p>
      <p class="mt-1 text-3xl font-bold font-num">${s.kp_covered}<span class="text-base font-medium text-slate-400">/${s.kp_total}</span></p>
      <div class="mt-2 h-2 rounded-full bg-slate-100 overflow-hidden"><div class="h-full bg-emerald-500" style="width:${s.kp_total ? s.kp_covered / s.kp_total * 100 : 0}%"></div></div>
      <p class="mt-1 text-xs text-slate-400">${s.kp_total - s.kp_covered > 0 ? `还有 ${s.kp_total - s.kp_covered} 个考点未考过` : '考点全覆盖'}</p>
    </div>
    </div>${weekCard(s)}
  </div>`;
}

// 本周学习：近 7 天题量与正确率，对比前 7 天
function weekCard(s) {
  const w = s.week;
  if (!w || !w.t1) return '';
  const p1 = Math.round(w.s1 / w.t1 * 100);
  const cutoff = Date.now() - 7 * 864e5;
  const days7 = new Set((s.attempt_day_ts || []).filter(ts => new Date(ts.replace(' ', 'T') + 'Z').getTime() >= cutoff).map(ts => localDay(ts))).size;
  let cmp = '';
  if (w.t0) {
    const p0 = Math.round(w.s0 / w.t0 * 100), d = p1 - p0;
    cmp = d === 0 ? `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 text-xs">与前 7 天持平</span>`
      : d > 0 ? `<span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-600 text-xs font-medium">较前 7 天 ▲ +${d}%</span>`
      : `<span class="px-2 py-0.5 rounded-full bg-rose-50 text-rose-500 text-xs font-medium">较前 7 天 ▼ ${d}%</span>`;
  }
  return `<div class="mt-4 pt-3.5 border-t border-slate-100 flex flex-wrap items-center gap-x-5 gap-y-1.5 text-sm">
    <span class="text-xs text-slate-500">近 7 天</span>
    <span>学习 <b class="font-num">${days7}</b>/7 天</span>
    <span>刷题 <b class="font-num">${w.t1}</b> 道</span>
    <span>正确率 <b class="font-num ${p1 < 40 ? 'text-rose-500' : p1 <= 70 ? 'text-amber-500' : 'text-emerald-600'}">${p1}%</b></span>
    ${s.essay7 && s.essay7.n ? `<span>主观题自评 <b class="font-num">${s.essay7.n}</b> 道 · 要点命中 <b class="font-num text-sky-600">${Math.round(s.essay7.hit / Math.max(1, s.essay7.total) * 100)}%</b></span>` : ''}
    ${cmp}
  </div>`;
}

// 每日一题打卡：揭晓即记当天；服务端同步，多设备连续天数一致
function dailyKey() { return 'zt_daily_' + (typeof ME !== 'undefined' && ME && ME.id || 0); }
function dailyDays() { try { return JSON.parse(localStorage.getItem(dailyKey()) || '[]'); } catch { return []; } }
async function syncDailyDays() {
  try {
    const d = await api('/checkin');
    const merged = [...new Set([...dailyDays(), ...(d.days || [])])].sort();
    localStorage.setItem(dailyKey(), JSON.stringify(merged.slice(-400)));
    localStorage.removeItem('zt_daily');
    if (dailyKey() !== 'zt_daily_0') localStorage.removeItem('zt_daily_0');
  } catch { }
}
function dailyMark() {
  const d = new Date().toISOString().slice(0, 10), a = dailyDays();
  if (!a.includes(d)) {
    a.push(d); localStorage.setItem(dailyKey(), JSON.stringify(a.slice(-400)));
    fetch('/api/daily-reveal?src=app', { method: 'POST' }).catch(() => { });
    api('/checkin', { method: 'POST' }).catch(() => { });
    const bd = document.getElementById('dailyBadge');
    if (bd) bd.innerHTML = dailyStreak() > 1 ? `<span class="px-1.5 py-0.5 rounded bg-rose-50 text-rose-500 text-[11px] font-semibold">${dailyStreak()} 天 🔥</span>` : `<span class="px-1.5 py-0.5 rounded bg-ok-50 text-ok-600 text-[11px] font-semibold">已打卡 ✓</span>`;
  }
}
function dailyStreak() {
  const s = new Set(dailyDays());
  let n = 0;
  for (let t = Date.now(); ; t -= 86400000) {
    const d = new Date(t).toISOString().slice(0, 10);
    if (s.has(d)) n++;
    else if (n === 0 && d === new Date().toISOString().slice(0, 10)) continue;
    else break;
  }
  return n;
}

// 分析题材料展示：设问已单独列出时，从材料段落中去掉重复的设问行
function subjStem(q) {
  if (!q.questions || !q.questions.length) return q.stem;
  const keys = q.questions.map(s => s.slice(0, 12));
  return q.stem.split('\n').filter(line => {
    const l = line.replace(/^\s*[（(]\d+[）)]\s*/, '');
    return !keys.some(k => k && l.startsWith(k));
  }).join('\n').trim();
}

// 分析题「背会了」标记（服务端持久、多设备同步；localStorage 作缓存与旧数据迁移源）
let SUBJMEMO = null;
function subjMemo() {
  if (SUBJMEMO) return SUBJMEMO;
  try { return JSON.parse(localStorage.getItem('zt_subjmemo_' + (ME ? ME.id : '')) || '{}'); } catch { return {}; }
}
async function loadSubjMemo() {
  if (SUBJMEMO) return SUBJMEMO;
  try {
    const d = await api('/subjmemo');
    if (typeof d.today_n === 'number') {
      const dk = 'zt_subjday_' + (ME ? ME.id + '_' : '') + new Date().toLocaleDateString();
      if (d.today_n > parseInt(localStorage.getItem(dk) || '0', 10)) { localStorage.setItem(dk, String(d.today_n)); window.__subjSeeded = true; }
    }
    const revKey = 'zt_subjrev_' + (ME ? ME.id + '_' : '') + new Date().toLocaleDateString();
    let reviewed = [];
    try { reviewed = JSON.parse(localStorage.getItem(revKey) || '[]'); } catch { }
    window.SUBJDUE = (d.due || []).filter(k => !reviewed.includes(k));
    // 要点自评结果：服务端为准合并进本地缓存（本地未同步的保留）
    if (d.hits) {
      const lh = subjHit();
      try { localStorage.setItem('zt_subjhit_' + (ME ? ME.id : '0'), JSON.stringify(Object.assign(lh, d.hits))); } catch { }
    }
    const m = {};
    for (const k of d.keys) m[k] = 1;
    // 仅首次迁移本地旧标记；此后以服务端为准，避免其他设备已删的标记被本地缓存"复活"
    const migrKey = 'zt_subjmemo_migr_' + (ME ? ME.id : '');
    if (!localStorage.getItem(migrKey)) {
      let local = {};
      try { local = JSON.parse(localStorage.getItem('zt_subjmemo_' + (ME ? ME.id : '')) || '{}'); } catch { }
      for (const k of Object.keys(local)) {
        if (!m[k]) {
          const [y, s] = k.split('-');
          m[k] = 1;
          api('/subjmemo', { method: 'POST', body: JSON.stringify({ year: +y, seq: +s, on: true }) }).catch(() => { });
        }
      }
      localStorage.setItem(migrKey, '1');
    }
    SUBJMEMO = m;
    localStorage.setItem('zt_subjmemo_' + (ME ? ME.id : ''), JSON.stringify(m));
  } catch { SUBJMEMO = subjMemo(); }
  return SUBJMEMO;
}
function toggleSubjMemo(btn, year, seq) {
  const m = subjMemo(); const k = year + '-' + seq;
  if (m[k]) delete m[k]; else m[k] = 1;
  SUBJMEMO = m;
  localStorage.setItem('zt_subjmemo_' + (ME ? ME.id : ''), JSON.stringify(m));
  const on = !!m[k];
  if (on) {

// 分析题按科目浏览：折叠分组，逐题直达题卡（✓ 表示已背会）
async function subjBySubjectHtml(memo) {
  let sk = null;
  try { sk = await api('/real/subjective/kps'); } catch { }
  if (!sk || !sk.kps || !sk.kps.length) return '';
  const groups = {};
  for (const r of sk.kps) (groups[r.subject || '其他'] = groups[r.subject || '其他'] || []).push(r);

    const ia = order.findIndex(o => a.startsWith(o.split('·')[0])), ib = order.findIndex(o => b.startsWith(o.split('·')[0]));

// 随机抽背：从未标「背会了」的分析题中随机抽一道，直达题卡
async function randomSubj(seqOnly) {
  let sy;
  try { sy = await api('/real/subjective/years'); } catch { return; }
  const memo = await loadSubjMemo();
  const ok = s => !seqOnly || s === seqOnly;
  const pool = [];
  for (const y of sy.years) for (let s = 34; s < 34 + y.n; s++) if (ok(s) && !memo[y.year + '-' + s]) pool.push([y.year, s]);
  if (!pool.length) {
    // 全部背完：进入复习模式，从已背的题里抽一道
    for (const y of sy.years) for (let s = 34; s < 34 + y.n; s++) if (ok(s)) pool.push([y.year, s]);
    if (!pool.length) return;
    toast(`${seqOnly ? '这科' : '全部'} ${pool.length} 道已背完，抽一道复习 🎉`, true);
  }
  const [year, seq] = pool[Math.floor(Math.random() * pool.length)];
  await viewRealSubj(year, seq);
}

// 到期温习：从背会超过 7 天的题里随机抽一道
async function reviewDueSubj() {
  await loadSubjMemo();
  const pool = (window.SUBJDUE || []).map(k => k.split('-').map(Number));
  if (!pool.length) return randomSubj();
  // 优先抽上次自评命中率最低的到期题（无自评记录视为未知，排在有记录的高命中之前）
  const hits = subjHit();
  const rate = ([y, s]) => { const h = hits[y + '-' + s]; return h && h.t ? h.n / h.t : 0.5; };
  pool.sort((a, b) => rate(a) - rate(b));
  const [year, seq] = pool[Math.floor(Math.random() * Math.min(pool.length, 3))] || pool[0];
  // 温习过的题当日不再提醒，徽章计数随之减少
  const k = year + '-' + seq;
  const revKey = 'zt_subjrev_' + (ME ? ME.id + '_' : '') + new Date().toLocaleDateString();
  let reviewed = [];
  try { reviewed = JSON.parse(localStorage.getItem(revKey) || '[]'); } catch { }
  if (!reviewed.includes(k)) { reviewed.push(k); localStorage.setItem(revKey, JSON.stringify(reviewed)); }
  window.SUBJDUE = (window.SUBJDUE || []).filter(x => x !== k);
  api('/subjmemo/review', { method: 'POST', body: JSON.stringify({ year, seq }) }).catch(() => {});
  toast('优先抽了一道你自评命中较低的到期题，温习后 7 天内不再提醒这道 🔁', true);
  await viewRealSubj(year, seq);
}

// 文件文本抽取：PDF（pdf.js）/ Word（mammoth）
async function extractFileText(file) {
  const buf = await file.arrayBuffer();
  if (/\.pdf$/i.test(file.name)) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      out += tc.items.map(it => it.str).join(' ') + '\n\n';
      if (out.length > 100000) break;
    }
    return out;
  }
  if (/\.docx$/i.test(file.name)) return (await mammoth.extractRawText({ arrayBuffer: buf })).value;
  throw new Error('暂不支持该格式，请上传 PDF 或 .docx');
}

async function viewExam(pid, retakeMode, autoResume) {
  const d = await api('/papers/' + pid);

  const saved = JSON.parse(localStorage.getItem('zt_exam_' + pid) || 'null');
  let answers = {}, start = Date.now();
  const canResume = saved && saved.answers && Object.keys(saved.answers).length && (!retakeMode || saved.retake);
  let marks = [];
  if (canResume && (autoResume || await askConfirm('检测到上次未完成的作答进度，是否继续？', '继续作答', '重新开始'))) {
    answers = saved.answers; start = Date.now() - (saved.elapsed || 0) * 1000;
    if (saved.retake) retakeMode = true;
    if (Array.isArray(saved.marks)) marks = saved.marks;
  }
  EXAM = { pid, questions: d.questions, answers, start, retake: !!retakeMode, marks };
  // 从第一个未答题目继续
  let first = d.questions.findIndex(q => !answers[q.id]);
  renderExam(first === -1 ? 0 : first);

const SUBJ_COLORS = {
  '历年真题': '#F43F5E', '马原·哲学': '#3D7FFF', '毛中特': '#FF7A2F', '史纲': '#8B5CF6', '思修法基': '#00B578', '形势与政策': '#0EA5E9' };
function subjTextColor(s) { return s && s.startsWith('历年真题') ? '#E11D48' : subjColor(s); }
function subjColor(s) {
  if (!s) return '#9AA3B2';
  if (SUBJ_COLORS[s]) return SUBJ_COLORS[s];
  for (const k in SUBJ_COLORS) if (s.includes(k)) return SUBJ_COLORS[k];
  const palette = ['#3D7FFF', '#FF7A2F', '#8B5CF6', '#00B578', '#0EA5E9', '#F43F5E'];
  let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return palette[h % palette.length];
}

// ---------- 错题重练（不消耗生成额度，答对可移出错题本） ----------
let PRACTICE = null;
function startPractice(subject) {
  let all = (window.WRONGQS || []).slice();
  if (subject) {
    const sub = all.filter(q => q.subject === subject);

  }
  if (!all.length) return toast('错题本是空的');
  // 间隔重复：默认只练到期错题，未到期的等复习日再出现
  const due = all.filter(q => q.due).sort(() => Math.random() - 0.5);
  const qs = due.length ? due : all.sort(() => Math.random() - 0.5);
  if (!due.length) toast('今日复习已清，本轮为自由加练', true);
  PRACTICE = { qs, i: 0, right: 0 };
  savePractice();
  setHash('practice');
  renderPractice();
}
function savePractice() {
  try { sessionStorage.setItem('zt_prac', JSON.stringify({ uid: ME && ME.id, qs: PRACTICE.qs, i: PRACTICE.i, right: PRACTICE.right })); } catch (e) {}
}

  let saved = null;

    renderPractice();

}

      }
      const psel = !answered && q.qtype === 'multi' && (P.sel || []).includes(k);
      return `<button ${answered ? 'disabled' : ''} onclick="${q.qtype==='multi' ? `togglePracticeOpt('${k}')` : `answerPractice('${k}')`}" class="opt-btn w-full text-left px-4 py-3 rounded-xl border ${cls} ${psel ? 'sel' : ''} text-sm flex gap-3"><span class="opt-badge shrink-0 w-6 h-6 grid place-items-center rounded-full bg-slate-100 text-xs font-bold">${k}</span><span>${esc(v)}</span></button>`;
    }).join('')}</div>
    ${!answered && q.qtype==='multi' ? `<button onclick="confirmPractice()" ${(P.sel||[]).length?'':'disabled'} class="mt-4 w-full py-3 rounded-xl bg-brand-500 text-white text-sm font-medium disabled:bg-slate-100 disabled:text-slate-400 disabled:cursor-not-allowed">确认答案${(P.sel||[]).length?`（已选 ${[...P.sel].sort().join('')}）`:''}</button>` : ''}
    ${answered ? `
    <div class="mt-4 rounded-xl ${answered === q.answer ? 'bg-emerald-50' : 'bg-rose-50'} p-4 text-sm">
      <p class="font-medium ${answered === q.answer ? 'text-emerald-700' : 'text-rose-600'}">${answered === q.answer ? '✓ 答对了！' : '✗ 答错了，正确答案：' + esc(q.answer)}<span id="pracFb" class="ml-2 text-xs font-normal text-emerald-600 ${PRACTICE.fb ? '' : 'hidden'}">${PRACTICE.fb || ''}</span></p>
      <p class="mt-1 text-xs text-brand-600">考点：${esc(q.knowledge_point)}</p>
      <p class="mt-2 text-slate-500 leading-relaxed">${fmtAnalysis(q.analysis)}</p>
      ${answered === q.answer ? `<button onclick="masterPractice(${q.id})" class="mt-3 px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-medium">已掌握，移出错题本</button>` : ''}
    </div>
    <button onclick="nextPractice()" class="mt-4 w-full py-3 rounded-xl bg-brand-500 text-white text-sm font-medium">${P.i + 1 < P.qs.length ? '下一题 →' : '完成练习'}</button>` : ''}
  </div>
  <button onclick="PRACTICE=null;sessionStorage.removeItem('zt_prac');document.onkeydown=null;viewWrong()" class="mt-4 inline-flex items-center gap-1.5 h-10 px-4 rounded-xl border border-slate-200 bg-white text-sm font-medium text-slate-600 hover:bg-slate-50">← 退出重练</button>
  <p class="mt-1 text-xs text-slate-500">快捷键：A-D 选择，回车/→ 下一题</p>`;
  bindPracticeKeys(answered);
  window.scrollTo(0, 0);
}
function togglePracticeOpt(k) {
  const P = PRACTICE;
  P.sel = P.sel || [];
  P.sel.includes(k) ? P.sel = P.sel.filter(x => x !== k) : P.sel.push(k);
  renderPractice();
}
function confirmPractice() {
  const P = PRACTICE;
  if (!P.sel || !P.sel.length) return;
  const ans = [...P.sel].sort().join('');
  P.sel = [];
  answerPractice(ans);
}
function answerPractice(k) {
  const q = PRACTICE.qs[PRACTICE.i];
  const correct = k === q.answer;
  if (correct) PRACTICE.right++;
  PRACTICE.fb = '';
  const day = new Date().toLocaleDateString();
  const key = 'zt_practice_' + (ME ? ME.id + '_' : '') + day;
  localStorage.setItem(key, String(parseInt(localStorage.getItem(key) || '0', 10) + 1));
  // 间隔重复：上报结果，答对升箱延后复习，连对 4 次自动毕业
  api(`/wrongbook/${q.id}/review`, { method: 'POST', body: JSON.stringify({ correct }) })
    .then(d => {
      if (d.graduated) PRACTICE.fb = '🎓 连续答对多次，已自动移出错题本';
      else if (correct && d.next_days) PRACTICE.fb = `${d.next_days} 天后再复习这道题`;
      else return;
      const el = document.getElementById('pracFb');
      if (el) { el.textContent = PRACTICE.fb; el.classList.remove('hidden'); }
    }).catch(() => {});
  renderPractice(k);
}
function bindPracticeKeys(answered) {
  document.onkeydown = e => {
    // 离开重练页（如顶栏导航）后自动清理监听，避免在其他页面误触答题
    if (!PRACTICE || CURVIEW !== 'practice') { PRACTICE = null; document.onkeydown = null; return; }
    const k = e.key.toUpperCase();
    const q = PRACTICE.qs[PRACTICE.i];
    if (!answered && ['A','B','C','D'].includes(k)) q.qtype === 'multi' ? togglePracticeOpt(k) : answerPractice(k);
    else if (!answered && q.qtype === 'multi' && e.key === 'Enter') confirmPractice();
    else if (answered && (e.key === 'Enter' || e.key === 'ArrowRight')) nextPractice();
  };
}
async function masterPractice(qid) {
  try { await api('/wrongbook/' + qid, { method: 'DELETE' }); toast('已移出错题本'); } catch (e) { toast(e.message); }
  nextPractice();
}
function nextPractice() {
  const P = PRACTICE;
  if (P.i + 1 < P.qs.length) { P.i++; P.sel = []; savePractice(); renderPractice(); }
  else {
    sessionStorage.removeItem('zt_prac');
    const pct = Math.round(P.right / P.qs.length * 100);
    app.innerHTML = nav() + `<div class="text-center py-14">
      <p class="text-4xl">${pct >= 80 ? '🎉' : '💪'}</p>
      <h1 class="mt-3 text-2xl font-bold">重练完成：答对 ${P.right} / ${P.qs.length}</h1>
      <p class="mt-2 text-sm text-slate-500">${pct >= 80 ? '很稳！继续保持，把剩下的错题也拿下' : '错题还没完全掌握，明天再练一轮'}</p>
      <div class="mt-6 flex justify-center gap-3">
        <button onclick="startPractice()" class="px-5 py-3 rounded-xl bg-white border border-slate-200 text-sm">再练一轮</button>
        <button onclick="viewWrong()" class="px-5 py-3 rounded-xl bg-brand-500 text-white text-sm font-medium">回错题本</button>
      </div></div>`;
    PRACTICE = null;
  }
}

async function sha1hex(s) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function exportApkg() {
  if (!ME.pro) return toast('Anki 导出为会员功能，请在「我的」中升级');
  const qs = window.WRONGQS || [];
  if (!qs.length) return toast('错题本为空');
  toast('正在打包 .apkg…', true);
  const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
  const db = new SQL.Database();
  const now = Date.now(), sec = Math.floor(now / 1000);
  const mid = now, did = now + 1;
  db.run(`CREATE TABLE col (id integer primary key, crt integer, mod integer, scm integer, ver integer, dty integer, usn integer, ls integer, conf text, models text, decks text, dconf text, tags text);
  CREATE TABLE notes (id integer primary key, guid text, mid integer, mod integer, usn integer, tags text, flds text, sfld text, csum integer, flags integer, data text);
  CREATE TABLE cards (id integer primary key, nid integer, did integer, ord integer, mod integer, usn integer, type integer, queue integer, due integer, ivl integer, factor integer, reps integer, lapses integer, left integer, odue integer, odid integer, flags integer, data text);
  CREATE TABLE revlog (id integer primary key, cid integer, usn integer, ease integer, ivl integer, lastIvl integer, factor integer, time integer, type integer);
  CREATE TABLE graves (usn integer, oid integer, type integer);
  CREATE INDEX ix_notes_usn on notes (usn); CREATE INDEX ix_cards_usn on cards (usn);
  CREATE INDEX ix_revlog_usn on revlog (usn); CREATE INDEX ix_cards_nid on cards (nid);
  CREATE INDEX ix_cards_sched on cards (did, queue, due); CREATE INDEX ix_revlog_cid on revlog (cid);
  CREATE INDEX ix_notes_csum on notes (csum);`);
  const conf = { nextPos:1, estTimes:true, activeDecks:[1], sortType:"noteFld", timeLim:0, sortBackwards:false, addToCur:true, curDeck:1, newBury:true, newSpread:0, dueCounts:true, curModel:String(mid), collapseTime:1200 };
  const models = {}; models[mid] = { id:mid, name:"真题工坊错题", type:0, mod:sec, usn:-1, sortf:0, did, tmpls:[{name:"Card 1",ord:0,qfmt:"{{正面}}",afmt:"{{FrontSide}}<hr id=answer>{{背面}}",bqfmt:"",bafmt:"",did:null}], flds:[{name:"正面",ord:0,sticky:false,rtl:false,font:"Arial",size:20},{name:"背面",ord:1,sticky:false,rtl:false,font:"Arial",size:20}], css:".card{font-family:arial;font-size:18px;text-align:left;color:black;background-color:white;padding:12px}", latexPre:"", latexPost:"", req:[[0,"all",[0]]] };
  const decks = { 1:{id:1,name:"Default",mod:sec,usn:-1,lrnToday:[0,0],revToday:[0,0],newToday:[0,0],timeToday:[0,0],conf:1,desc:"",dyn:0,collapsed:false,extendNew:10,extendRev:50} };
  decks[did] = { ...decks[1], id:did, name:"真题工坊·错题本" };
  const dconf = { 1:{id:1,name:"Default",mod:0,usn:0,maxTaken:60,autoplay:true,timer:0,replayq:true,new:{bury:true,delays:[1,10],initialFactor:2500,ints:[1,4,7],order:1,perDay:20,separate:true},rev:{bury:true,ease4:1.3,fuzz:0.05,ivlFct:1,maxIvl:36500,minSpace:1,perDay:100},lapse:{delays:[10],leechAction:0,leechFails:8,minInt:1,mult:0},dyn:false} };
  db.run("INSERT INTO col VALUES (1,?,?,?,11,0,0,0,?,?,?,?,?)", [sec, now, now, JSON.stringify(conf), JSON.stringify(models), JSON.stringify(decks), JSON.stringify(dconf), "{}"]);
  let id = now;
  for (const q of qs) {
    const tag = q.qtype === 'multi' ? '【多选】' : '【单选】';
    const front = `${tag}${q.stem}<br><br>A. ${q.opt_a}<br>B. ${q.opt_b}<br>C. ${q.opt_c}<br>D. ${q.opt_d}`;
    const back = `<b>答案：${q.answer}</b><br><br>${q.analysis}<br><br><i>考点：${q.knowledge_point}${q.subject ? ` · 科目：${q.subject}` : ''}</i>`;
    const flds = front + "\x1f" + back;
    const csum = parseInt((await sha1hex(front)).slice(0, 8), 16);
    const nid = ++id;
    db.run("INSERT INTO notes VALUES (?,?,?,?,-1,'',?,?,?,0,'')", [nid, String(nid), mid, sec, flds, front.slice(0,100), csum]);
    db.run("INSERT INTO cards VALUES (?,?,?,0,?,-1,0,0,?,0,2500,0,0,0,0,0,0,'')", [++id, nid, did, sec, nid % 100000]);
  }
  const data = db.export();
  const zip = new JSZip();
  zip.file("collection.anki2", data);
  zip.file("media", "{}");
  const blob = await zip.generateAsync({ type: "blob" });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `真题工坊错题_${new Date().toISOString().slice(0,10)}.apkg`;
  a.click();
  toast('已下载 .apkg，可直接导入 Anki', true);
}

// ---------- 个人统计页：汇总卡 + 正确率趋势 + 弱项榜 + 成绩列表 ----------
async function viewHistory() {
  CURVIEW = 'history'; setHash('history');
  app.innerHTML = nav() + `<div class="text-center py-10 text-slate-400">加载中…</div>`;
  const [d, ks, st, sk] = await Promise.all([api('/history'), api('/kpstats').catch(() => null), api('/stats').catch(() => null), api('/real/subjective/kps').catch(() => null)]);
  // 弱考点 → 相关历年分析题（按归一化考点名匹配，取最近年份）
  const normKpW = n => (n || '').replace(/和/g, '与').replace(/的辩证关系$/, '');
  const subjByKp = {};
  if (sk && sk.kps) for (const r of sk.kps) { const k2 = normKpW(r.kp_name); if (!subjByKp[k2]) subjByKp[k2] = r.year + ',' + r.seq; }
  const rows = (d.attempts || []).filter(a => a.total > 0);
  // 汇总卡：累计题数 / 平均正确率 / 学习天数 / 连续天数
  if (st) { window.__attempts = st.attempts || []; window.__dayTs = st.attempt_day_ts || []; }
  const scored = rows.filter(a => a.answered === undefined || a.answered > 0);
  const sumT = scored.reduce((s, a) => s + a.total, 0);
  const sumS = scored.reduce((s, a) => s + a.score, 0);

  const days = st ? studyDays().size : 0;

        <div class="flex items-center justify-between gap-2 text-sm"><span class="min-w-0 truncate font-medium">${i + 1}. ${esc(k.kp)}</span><span class="shrink-0 flex items-center gap-2"><span class="${txt} font-semibold font-num">${pct}%</span>${k.kp_id ? `<button onclick="drillKp(${k.material_id},${k.kp_id})" class="min-h-[32px] px-2.5 py-1.5 rounded-full border border-brand-200 text-brand-600 text-xs font-medium hover:bg-brand-50">练一练</button>` : `<button onclick="drillKpByName('${esc(k.kp).replace(/'/g, '&#39;')}',this)" class="min-h-[32px] px-2.5 py-1.5 rounded-full border border-brand-200 text-brand-600 text-xs font-medium hover:bg-brand-50">AI 补练</button>`}${subjByKp[normKpW(k.kp)] ? `<button onclick="viewRealSubj(${subjByKp[normKpW(k.kp)]})" class="min-h-[32px] px-2.5 py-1.5 rounded-full border border-rose-200 text-rose-600 text-xs font-medium hover:bg-rose-50" title="该考点有历年分析题，去背参考要点">背分析题</button>` : ''}</span></div>
        <div class="mt-1.5 h-2 rounded-full bg-black/5 overflow-hidden"><div class="h-full ${bar}" style="width:${pct}%"></div></div>
        <p class="mt-1 text-xs text-ink-3">答 ${k.total} 题 · 错 ${k.total - k.correct}${pct < 50 ? ' · 建议优先复习' : ''}</p>
      </div>`;
    }).join('')}${kps.length > 10 ? `<div id="allKps" class="hidden space-y-2 pt-1 border-t border-slate-100">${kps.slice(10).map((k, i) => {
      const pct = Math.round(k.correct / k.total * 100);
      const bar = pct < 50 ? 'bg-bad-500' : pct <= 70 ? 'bg-warn-500' : 'bg-ok-500';
      const txt = pct < 50 ? 'text-bad-600' : pct <= 70 ? 'text-warn-600' : 'text-ok-600';
      return `<div class="flex items-center gap-3 text-sm"><span class="w-6 shrink-0 text-xs text-ink-3 font-num">${i + 11}.</span><span class="min-w-0 flex-1 truncate">${esc(k.kp)}</span><div class="w-24 shrink-0 h-1.5 rounded-full bg-black/5 overflow-hidden"><div class="h-full ${bar}" style="width:${pct}%"></div></div><span class="w-10 shrink-0 text-right ${txt} text-xs font-semibold font-num">${pct}%</span></div>`;
    }).join('')}</div><button onclick="const a=document.getElementById('allKps');a.classList.toggle('hidden');this.textContent=a.classList.contains('hidden')?'查看全部 ${kps.length} 个考点掌握度 ▾':'收起 ▴'" class="min-h-[32px] text-xs text-brand-500 hover:text-brand-600 font-medium">查看全部 ${kps.length} 个考点掌握度 ▾</button>` : ''}</div>
  </section>` : (rows.length ? `<section class="rounded-2xl border border-dashed border-slate-200 bg-white p-6 text-center">
    <p class="text-sm text-ink-2">同一考点作答满 2 题后，这里会按正确率排出你的薄弱考点，并可一键定向特训</p>
    <button onclick="viewHome()" class="mt-3 px-4 py-2 rounded-xl bg-brand-500 text-white text-sm font-medium">再考一卷解锁</button>
  </section>` : '');
  // 历史成绩列表
  const listSec = rows.length ? `<section class="bg-white rounded-2xl border border-black/5 shadow-card p-4 sm:p-5">
    <h2 class="text-lg font-bold">历史成绩<span class="ml-2 text-xs font-normal text-ink-3">共 ${rows.length} 次作答，点击查看逐题解析</span></h2>
    <div class="mt-3 space-y-2">${rows.map(a => {
      const pct = Math.round(a.score / a.total * 100);
      const badge = pct < 50 ? 'bg-bad-50 text-bad-600' : pct <= 70 ? 'bg-warn-50 text-warn-600' : 'bg-ok-50 text-ok-600';
      return `<button onclick="viewResult(${a.paper_id})" class="w-full text-left flex items-center gap-3 px-4 py-3 rounded-xl bg-page hover:bg-brand-50 transition-colors">
        <span class="min-w-0 flex-1">
          <span class="block truncate text-sm font-medium">${esc(a.title || '未命名试卷')}</span>
          <span class="block text-xs text-ink-3 mt-0.5">${a.subject && !String(a.title || '').includes(a.subject) ? esc(a.subject) + ' · ' : ''}${a.score}/${a.total} 题 · 用时 ${fmtDur(a.duration_sec)} · ${fmtDate(a.created_at)}</span>
        </span>
        <span class="shrink-0 px-2.5 py-1 rounded-full ${badge} text-xs font-bold font-num">${pct}%</span>

    }).join('')}</div>
  </section>` : `<section class="bg-white rounded-2xl border border-black/5 shadow-card p-10 text-center text-slate-400 text-sm">还没有交卷记录，去生成一份模拟卷开始吧</section>`;

        <p class="mt-2 text-sm">已背 <b class="font-num text-rose-600">${n}</b>/${total} 道${(() => {
          const hs = Object.values(subjHit()).filter(h => h && h.t);

        ${(window.SUBJDUE || []).length ? `<button onclick="reviewDueSubj()" class="btn-press mt-2.5 inline-flex items-center gap-1 min-h-[32px] px-3 py-1.5 rounded-full border border-amber-200 bg-amber-50 text-amber-700 text-xs font-semibold hover:bg-amber-100">🔁 <span class="font-num">${window.SUBJDUE.length}</span> 道背会超 7 天 · 抽一道温习 ›</button>` : ''}
      </section>`;
    } catch { }
  })();
  window.scrollTo(0, 0);

// ---------- 轻量 hash 路由：刷新/后退不丢页 ----------
let __navInternal = false;
function setHash(h) {
  document.querySelectorAll('.app-confirm').forEach(el => el.remove());
  if (!/^realbrowse\//.test(h)) { const rp = document.getElementById('resumePos'); if (rp) rp.remove(); }
  if (location.hash.slice(1) !== h) { __navInternal = true; location.hash = h; }
}
function routeByHash() {
  const h = location.hash.slice(1);
  const rs = h.match(/^reset-([0-9a-f]{48})$/);
  if (rs) return viewReset(rs[1]);
  if (h === 'real') return viewReal();
  if (h === 'realfavs') return viewRealFavs();
  const rb = h.match(/^realbrowse\/(\d{4})$/);
  if (rb) return viewRealBrowse(+rb[1]);
  const ry = h.match(/^realyear\/(\d{4})$/);
  if (ry) return startRealYear(+ry[1]);
  const rsj = h.match(/^realsubj\/(\d{4})(?:-(\d{1,2}))?$/);
  if (rsj) return viewRealSubj(+rsj[1], rsj[2] ? +rsj[2] : undefined);
  const rq = h.match(/^realsearch\/(.+)$/);
  if (rq) return searchReal(decodeURIComponent(rq[1]));
  if (h === 'realrand') return startRandPaper();
  if (h === 'wrong') return viewWrong();
  if (h === 'history') return viewHistory();
  if (h === 'practice') return resumePractice();
  if (h === 'account') return viewAccount();
  if (h === 'upload') return viewUpload();
  const m = h.match(/^material\/(\d+)$/);
  if (m) return viewMaterial(+m[1]);
  const r = h.match(/^result\/(\d+)$/);
  if (r) return viewResult(+r[1]);
  return viewHome();
}
window.addEventListener('hashchange', () => {
  if (__navInternal) { __navInternal = false; return; }
  if (!ME) { const rs = location.hash.match(/^#reset-([0-9a-f]{48})$/); if (rs) return viewReset(rs[1]); if (/^#reg(-|$)/.test(location.hash)) viewAuth(); return; }
  if (EXAM) { setHash('exam'); return; } // 答题中不响应 hash 导航，避免误退出；回写 hash 防止 history 被后退耗尽
  routeByHash();
});

// ---------- PWA：service worker + 安装引导 ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
let __installEvt = null;
function showInstallBanner(html, onOk) {
  if (localStorage.getItem('zt_pwa_dismissed')) return;
  if (!TOKEN) return; // 未登录不打扰，登录后再引导安装
  if (EXAM) return; // 答题中不打扰，避免遮挡底部操作栏
  const bar = document.createElement('div');
  bar.id = 'pwaBar';
  bar.className = 'fixed bottom-20 sm:bottom-4 left-1/2 -translate-x-1/2 z-50 w-[calc(100%-2rem)] max-w-sm bg-white rounded-2xl shadow-xl border border-slate-200 p-4 text-sm';
  bar.innerHTML = `<div class="flex items-start gap-3">
    <img src="/icon-192.png" class="w-10 h-10 rounded-xl shrink-0" alt="">
    <div class="min-w-0 flex-1">${html}</div>
    <button id="pwaClose" class="shrink-0 p-2 -m-2 text-slate-400 hover:text-slate-600" aria-label="关闭">✕</button>
  </div>`;
  document.body.appendChild(bar);
  document.body.style.paddingBottom = '7rem'; // 安装条悬浮时页底留白，不遮挡末行按钮
  if (!document.getElementById('pwabarcss')) { const s = document.createElement('style'); s.id = 'pwabarcss'; s.textContent = 'body.pwabar-on #backTop{bottom:13rem}body.pwabar-on #resumePos{bottom:16rem}@media(min-width:640px){body.pwabar-on #backTop{bottom:8rem}body.pwabar-on #resumePos{bottom:11rem}}'; document.head.appendChild(s); }
  document.body.classList.add('pwabar-on'); // 固定按钮（回顶等）避开安装条
  const rm = () => { bar.remove(); document.body.style.paddingBottom = ''; document.body.classList.remove('pwabar-on'); };
  bar.querySelector('#pwaClose').onclick = () => { localStorage.setItem('zt_pwa_dismissed', '1'); rm(); };
  const ok = bar.querySelector('#pwaOk');
  if (ok && onOk) ok.onclick = () => { onOk(); rm(); };
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); __installEvt = e;
  showInstallBanner(`<p class="font-medium">把真题工坊装到主屏幕</p><p class="mt-0.5 text-xs text-slate-500">像 App 一样打开，刷题更顺手</p><button id="pwaOk" class="mt-2 px-3 py-1.5 rounded-lg bg-brand-500 text-white text-xs font-medium">一键安装</button>`,
    () => { if (__installEvt) { __installEvt.prompt(); __installEvt = null; localStorage.setItem('zt_pwa_dismissed', '1'); } });
});
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone && !window.matchMedia('(display-mode: standalone)').matches) {
  setTimeout(() => showInstallBanner(`<p class="font-medium">把真题工坊装到主屏幕</p><p class="mt-0.5 text-xs text-slate-500">点浏览器底部「分享」按钮 → 选「添加到主屏幕」，像 App 一样打开</p>`), 3000);
}

// ---------- boot ----------
(async () => {
  if (TOKEN) {
    try { await loadMe(); routeByHash(); return; }
    catch (e) {
      if (e.status === 401) { TOKEN=''; localStorage.removeItem('zt_token'); }
      else {
        // 瞬时网络故障不清登录态，重试一次后提示
        await new Promise(r => setTimeout(r, 1500));
        try { await loadMe(); routeByHash(); return; } catch (e2) {
          if (e2.status === 401) { TOKEN=''; localStorage.removeItem('zt_token'); }
          else { app.innerHTML = nav() + `<div class="text-center py-16"><p class="text-sm text-slate-500">网络开小差了，请检查网络后重试</p><button onclick="location.reload()" class="mt-4 h-11 px-6 rounded-xl bg-brand-500 text-white text-sm font-semibold">重新加载</button></div>`; return; }
        }
      }
    }
  }
  viewAuth();
})();
