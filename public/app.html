<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真题工坊 · 工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<style>
  .grad { background: linear-gradient(135deg,#4f46e5,#7c3aed); }
  .opt-btn.sel { border-color:#4f46e5; background:#eef2ff; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
<div id="app" class="max-w-3xl mx-auto px-4 pb-24"></div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let TOKEN = localStorage.getItem('zt_token') || '';
let ME = null;

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch('/api' + path, opts);
  const data = await r.json().catch(() => ({ error: '网络错误' }));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nav() {
  return `<header class="flex items-center justify-between py-5">
    <a href="/" class="font-bold text-lg">📝 真题工坊</a>
    <div class="flex items-center gap-3 text-sm">
      ${ME ? `<button onclick="viewHome()" class="text-slate-500 hover:text-indigo-600">工作台</button>
      <button onclick="viewWrong()" class="text-slate-500 hover:text-indigo-600">错题本</button>
      <button onclick="viewAccount()" class="text-slate-500 hover:text-indigo-600">${ME.pro ? '👑' : ''}我的</button>` : ''}
    </div></header>`;
}
function toast(msg, ok=false) {
  const t = document.createElement('div');
  t.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl text-white text-sm shadow-lg z-50 ${ok?'bg-emerald-600':'bg-slate-800'}`;
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ---------- auth ----------
function viewAuth() {
  app.innerHTML = nav() + `
  <div class="max-w-sm mx-auto mt-10 bg-white rounded-2xl shadow-sm border border-slate-100 p-7">
    <h1 class="text-xl font-bold text-center" id="authTitle">登录真题工坊</h1>
    <div class="mt-5 space-y-3">
      <input id="email" type="email" placeholder="邮箱" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
      <input id="password" type="password" placeholder="密码（至少 6 位）" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
      <button id="authBtn" class="w-full py-3 rounded-xl grad text-white font-semibold">登录</button>
      <p class="text-center text-sm text-slate-500"><span id="switchHint">还没有账号？</span><button id="switchBtn" class="text-indigo-600 font-medium">注册</button></p>
    </div></div>`;
  let mode = 'login';
  $('#switchBtn').onclick = () => {
    mode = mode === 'login' ? 'register' : 'login';
    $('#authTitle').textContent = mode === 'login' ? '登录真题工坊' : '注册账号';
    $('#authBtn').textContent = mode === 'login' ? '登录' : '注册';
    $('#switchHint').textContent = mode === 'login' ? '还没有账号？' : '已有账号？';
    $('#switchBtn').textContent = mode === 'login' ? '注册' : '登录';
  };
  $('#authBtn').onclick = async () => {
    try {
      $('#authBtn').textContent = '请稍候…';
      const d = await api('/' + mode, { method: 'POST', body: JSON.stringify({ email: $('#email').value.trim(), password: $('#password').value }) });
      TOKEN = d.token; localStorage.setItem('zt_token', TOKEN);
      await loadMe(); viewHome();
    } catch (e) { toast(e.message); $('#authBtn').textContent = mode === 'login' ? '登录' : '注册'; }
  };
}
async function loadMe() { const d = await api('/me'); ME = { ...d.user, pro: d.pro }; }

// ---------- home ----------
async function viewHome() {
  app.innerHTML = nav() + `<div class="text-center py-10 text-slate-400">加载中…</div>`;
  const [mats, papers] = await Promise.all([api('/materials'), api('/papers')]);
  app.innerHTML = nav() + `
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold">我的资料</h1>
    <button onclick="viewUpload()" class="px-4 py-2 rounded-xl grad text-white text-sm font-medium">+ 上传资料</button>
  </div>
  <div class="mt-4 space-y-3">${mats.materials.length ? mats.materials.map(m => `
    <div class="bg-white rounded-2xl border border-slate-100 p-4 flex items-center justify-between">
      <div><p class="font-medium">${esc(m.title)}</p><p class="text-xs text-slate-400 mt-0.5">${(m.size/1000).toFixed(1)}k 字 · ${m.created_at.slice(0,10)}</p></div>
      <button onclick="viewMaterial(${m.id})" class="px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-600 text-sm font-medium">出卷 →</button>
    </div>`).join('') : `<div class="bg-white rounded-2xl border border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">还没有资料。粘贴你的讲义/笔记，1 分钟得到一份仿真模拟卷。</div>`}</div>
  <h2 class="text-xl font-bold mt-8">我的试卷</h2>
  <div class="mt-4 space-y-3">${papers.papers.length ? papers.papers.map(pp => `
    <div class="bg-white rounded-2xl border border-slate-100 p-4 flex items-center justify-between">
      <div><p class="font-medium">${esc(pp.title)}</p><p class="text-xs text-slate-400 mt-0.5">${pp.status==='ready'?pp.question_count+' 题':pp.status==='generating'?'⏳ 生成中…':'生成失败'} · ${pp.created_at.slice(0,16)}</p></div>
      ${pp.status==='ready' ? `<button onclick="viewExam(${pp.id})" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-medium">开始答题</button>` :
        pp.status==='generating' ? `<button onclick="viewHome()" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-500 text-sm">刷新</button>` : `<span class="text-xs text-rose-500">失败</span>`}
    </div>`).join('') : `<div class="text-sm text-slate-400 py-4 text-center">暂无试卷</div>`}</div>`;
}

// ---------- upload ----------
function viewUpload() {
  app.innerHTML = nav() + `
  <h1 class="text-xl font-bold">上传复习资料</h1>
  <p class="text-sm text-slate-500 mt-1">粘贴讲义、笔记、教材节选（200 字以上）。AI 将自动抽取考点清单。</p>
  <input id="mtitle" placeholder="资料标题，如：马原核心考点讲义" class="mt-4 w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
  <textarea id="mcontent" rows="14" placeholder="在此粘贴资料全文…" class="mt-3 w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm"></textarea>
  <button id="upBtn" class="mt-4 w-full py-3.5 rounded-xl grad text-white font-semibold">上传并抽取考点（约 20 秒）</button>`;
  $('#upBtn').onclick = async () => {
    try {
      $('#upBtn').textContent = '⏳ 正在抽取考点，请稍候…'; $('#upBtn').disabled = true;
      const d = await api('/materials', { method: 'POST', body: JSON.stringify({ title: $('#mtitle').value.trim(), content: $('#mcontent').value }) });
      toast('考点抽取完成', true); viewMaterial(d.id);
    } catch (e) { toast(e.message); $('#upBtn').textContent = '上传并抽取考点（约 20 秒）'; $('#upBtn').disabled = false; }
  };
}

// ---------- material / generate ----------
async function viewMaterial(id) {
  app.innerHTML = nav() + `<div class="text-center py-10 text-slate-400">加载中…</div>`;
  const d = await api('/materials/' + id);
  app.innerHTML = nav() + `
  <h1 class="text-xl font-bold">${esc(d.material.title)}</h1>
  <p class="text-sm text-slate-500 mt-1">勾选本次要考的考点（默认全选），选择题量后生成。</p>
  <div class="mt-4 bg-white rounded-2xl border border-slate-100 p-4 space-y-1 max-h-96 overflow-y-auto">
    ${d.knowledge_points.map(k => `<label class="flex items-center gap-2 py-1.5 text-sm"><input type="checkbox" class="kp accent-indigo-600" value="${k.id}" checked><span>${esc(k.name)}</span><span class="text-xs text-slate-400">${esc(k.section||'')}</span></label>`).join('')}
  </div>
  <div class="mt-4 flex items-center gap-3">
    <select id="qcount" class="px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm">
      <option value="10">10 题</option><option value="15">15 题${ME.pro?'':'（会员）'}</option><option value="20">20 题${ME.pro?'':'（会员）'}</option>
    </select>
    <button id="genBtn" class="flex-1 py-3 rounded-xl grad text-white font-semibold">生成仿真模拟卷</button>
  </div>
  <p class="text-xs text-slate-400 mt-2">生成含逐考点命题、查重与 AI 审校，约 1-2 分钟。免费版每天 1 份。</p>`;
  $('#genBtn').onclick = async () => {
    const kp_ids = [...document.querySelectorAll('.kp:checked')].map(x => +x.value);
    const count = +$('#qcount').value;
    if (!ME.pro && count > 10) return toast('15/20 题为会员功能，请先升级');
    try {
      $('#genBtn').textContent = '⏳ 已提交，正在生成…'; $('#genBtn').disabled = true;
      const d2 = await api('/papers', { method: 'POST', body: JSON.stringify({ material_id: id, count, kp_ids }) });
      pollPaper(d2.id);
    } catch (e) { toast(e.message); $('#genBtn').textContent = '生成仿真模拟卷'; $('#genBtn').disabled = false; }
  };
}
async function pollPaper(pid) {
  app.innerHTML = nav() + `<div class="text-center py-20">
    <div class="animate-spin w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full mx-auto"></div>
    <p class="mt-4 text-slate-500 text-sm">正在命题：逐考点生成 → 查重 → AI 审校…<br>约 1-2 分钟，请勿关闭页面</p></div>`;
  const timer = setInterval(async () => {
    try {
      const d = await api('/papers/' + pid);
      if (d.paper.status === 'ready') { clearInterval(timer); toast('试卷已就绪', true); viewExam(pid); }
      else if (d.paper.status === 'failed') { clearInterval(timer); toast('生成失败，请重试'); viewHome(); }
    } catch (e) {}
  }, 5000);
}

// ---------- exam ----------
let EXAM = null;
async function viewExam(pid) {
  const d = await api('/papers/' + pid);
  if (d.paper.status !== 'ready') return pollPaper(pid);
  EXAM = { pid, questions: d.questions, answers: {}, start: Date.now() };
  renderExam(0);
}
function renderExam(i) {
  const qs = EXAM.questions, q = qs[i];
  app.innerHTML = nav() + `
  <div class="flex items-center justify-between text-sm text-slate-500">
    <span>第 ${i+1} / ${qs.length} 题</span><span id="clock">⏱ 0:00</span>
  </div>
  <div class="mt-3 bg-white rounded-2xl border border-slate-100 p-5">
    <p class="font-medium leading-relaxed">${esc(q.stem)}</p>
    <div class="mt-4 space-y-2">
      ${['a','b','c','d'].map(o => `<button data-opt="${o.toUpperCase()}" class="opt-btn w-full text-left px-4 py-3 rounded-xl border border-slate-200 text-sm hover:border-indigo-300 ${EXAM.answers[q.id]===o.toUpperCase()?'sel':''}">${o.toUpperCase()}. ${esc(q['opt_'+o])}</button>`).join('')}
    </div>
    <p class="mt-3 text-xs text-slate-400">考点：${esc(q.knowledge_point)}</p>
  </div>
  <div class="mt-4 flex gap-3">
    <button ${i===0?'disabled':''} onclick="renderExam(${i-1})" class="px-5 py-3 rounded-xl bg-white border border-slate-200 text-sm disabled:opacity-40">上一题</button>
    ${i < qs.length-1 ? `<button onclick="renderExam(${i+1})" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white text-sm font-medium">下一题</button>`
      : `<button onclick="submitExam()" class="flex-1 py-3 rounded-xl grad text-white text-sm font-semibold">交卷（已答 <span id="done">${Object.keys(EXAM.answers).length}</span>/${qs.length}）</button>`}
  </div>
  <div class="mt-4 flex flex-wrap gap-1.5">${qs.map((qq,j) => `<button onclick="renderExam(${j})" class="w-8 h-8 rounded-lg text-xs ${EXAM.answers[qq.id]?'bg-indigo-600 text-white':'bg-white border border-slate-200 text-slate-500'} ${j===i?'ring-2 ring-indigo-400':''}">${j+1}</button>`).join('')}</div>`;
  document.querySelectorAll('.opt-btn').forEach(b => b.onclick = () => {
    EXAM.answers[q.id] = b.dataset.opt;
    if (i < qs.length - 1) renderExam(i + 1); else renderExam(i);
  });
  updateClock();
}
let clockTimer = null;
function updateClock() {
  clearInterval(clockTimer);
  clockTimer = setInterval(() => {
    const s = Math.floor((Date.now() - EXAM.start) / 1000);
    const el = $('#clock'); if (el) el.textContent = `⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  }, 1000);
}
async function submitExam() {
  clearInterval(clockTimer);
  try {
    const d = await api(`/papers/${EXAM.pid}/submit`, { method: 'POST', body: JSON.stringify({ answers: EXAM.answers, duration_sec: Math.floor((Date.now()-EXAM.start)/1000) }) });
    renderResult(d);
  } catch (e) { toast(e.message); }
}
function renderResult(d) {
  const pct = Math.round(d.score / d.total * 100);
  const kpMap = {};
  d.detail.forEach(x => { kpMap[x.knowledge_point] = kpMap[x.knowledge_point] || { t:0, c:0 }; kpMap[x.knowledge_point].t++; if (x.correct) kpMap[x.knowledge_point].c++; });
  app.innerHTML = nav() + `
  <div class="text-center py-6">
    <p class="text-5xl font-extrabold ${pct>=60?'text-emerald-600':'text-rose-500'}">${d.score}<span class="text-xl text-slate-400"> / ${d.total}</span></p>
    <p class="text-sm text-slate-500 mt-1">正确率 ${pct}% · 错题已自动加入错题本</p>
  </div>
  <h2 class="font-bold">考点覆盖度</h2>
  <div class="mt-2 bg-white rounded-2xl border border-slate-100 p-4 space-y-2">
    ${Object.entries(kpMap).map(([k,v]) => `<div class="flex items-center gap-2 text-sm"><span class="flex-1 truncate">${esc(k)}</span>
      <div class="w-28 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${v.c===v.t?'bg-emerald-500':v.c?'bg-amber-400':'bg-rose-400'}" style="width:${v.c/v.t*100}%"></div></div>
      <span class="text-xs text-slate-400 w-8 text-right">${v.c}/${v.t}</span></div>`).join('')}
  </div>
  <h2 class="font-bold mt-6">逐题解析</h2>
  <div class="mt-2 space-y-3">${d.detail.map(x => `
    <div class="bg-white rounded-2xl border ${x.correct?'border-slate-100':'border-rose-200'} p-4 text-sm">
      <p class="font-medium">${x.seq}. ${esc(x.stem)}</p>
      <p class="mt-2 ${x.correct?'text-emerald-600':'text-rose-500'}">${x.correct?'✓ 正确':'✗ 你的答案：'+(x.your||'未作答')} · 正确答案：${x.answer}</p>
      <p class="mt-2 text-slate-500 leading-relaxed">${esc(x.analysis)}</p>
    </div>`).join('')}</div>
  <button onclick="viewHome()" class="mt-6 w-full py-3 rounded-xl bg-white border border-slate-200 text-sm">返回工作台</button>`;
  window.scrollTo(0, 0);
}

// ---------- wrong book ----------
async function viewWrong() {
  app.innerHTML = nav() + `<div class="text-center py-10 text-slate-400">加载中…</div>`;
  const d = await api('/wrongbook');
  app.innerHTML = nav() + `
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold">错题本（${d.questions.length}）</h1>
    ${d.questions.length ? `<button onclick="exportApkg()" class="px-4 py-2 rounded-xl grad text-white text-sm font-medium">导出 Anki .apkg</button>` : ''}
  </div>
  <div class="mt-4 space-y-3">${d.questions.length ? d.questions.map(q => `
    <div class="bg-white rounded-2xl border border-slate-100 p-4 text-sm">
      <p class="font-medium">${esc(q.stem)}</p>
      <div class="mt-2 text-slate-500 space-y-0.5"><p>A. ${esc(q.opt_a)}</p><p>B. ${esc(q.opt_b)}</p><p>C. ${esc(q.opt_c)}</p><p>D. ${esc(q.opt_d)}</p></div>
      <details class="mt-2"><summary class="text-indigo-600 cursor-pointer">查看答案与解析</summary>
        <p class="mt-1 text-emerald-600 font-medium">答案：${q.answer}</p><p class="mt-1 text-slate-500">${esc(q.analysis)}</p></details>
      <button onclick="removeWrong(${q.id})" class="mt-2 text-xs text-slate-400 hover:text-rose-500">移出错题本</button>
    </div>`).join('') : '<p class="text-center text-slate-400 py-10 text-sm">暂无错题，去做一份模拟卷吧</p>'}</div>`;
  window.WRONGQS = d.questions;
}
async function removeWrong(id) { await api('/wrongbook/' + id, { method: 'DELETE' }); viewWrong(); }

// ---------- Anki apkg export ----------
async function sha1hex(s) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function exportApkg() {
  if (!ME.pro) return toast('Anki 导出为会员功能，请在「我的」中升级');
  const qs = window.WRONGQS || [];
  if (!qs.length) return toast('错题本为空');
  toast('正在打包 .apkg…', true);
  const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
  const db = new SQL.Database();
  const now = Date.now(), sec = Math.floor(now / 1000);
  const mid = now, did = now + 1;
  db.run(`CREATE TABLE col (id integer primary key, crt integer, mod integer, scm integer, ver integer, dty integer, usn integer, ls integer, conf text, models text, decks text, dconf text, tags text);
  CREATE TABLE notes (id integer primary key, guid text, mid integer, mod integer, usn integer, tags text, flds text, sfld text, csum integer, flags integer, data text);
  CREATE TABLE cards (id integer primary key, nid integer, did integer, ord integer, mod integer, usn integer, type integer, queue integer, due integer, ivl integer, factor integer, reps integer, lapses integer, left integer, odue integer, odid integer, flags integer, data text);
  CREATE TABLE revlog (id integer primary key, cid integer, usn integer, ease integer, ivl integer, lastIvl integer, factor integer, time integer, type integer);
  CREATE TABLE graves (usn integer, oid integer, type integer);
  CREATE INDEX ix_notes_usn on notes (usn); CREATE INDEX ix_cards_usn on cards (usn);
  CREATE INDEX ix_revlog_usn on revlog (usn); CREATE INDEX ix_cards_nid on cards (nid);
  CREATE INDEX ix_cards_sched on cards (did, queue, due); CREATE INDEX ix_revlog_cid on revlog (cid);
  CREATE INDEX ix_notes_csum on notes (csum);`);
  const conf = { nextPos:1, estTimes:true, activeDecks:[1], sortType:"noteFld", timeLim:0, sortBackwards:false, addToCur:true, curDeck:1, newBury:true, newSpread:0, dueCounts:true, curModel:String(mid), collapseTime:1200 };
  const models = {}; models[mid] = { id:mid, name:"真题工坊错题", type:0, mod:sec, usn:-1, sortf:0, did, tmpls:[{name:"Card 1",ord:0,qfmt:"{{正面}}",afmt:"{{FrontSide}}<hr id=answer>{{背面}}",bqfmt:"",bafmt:"",did:null}], flds:[{name:"正面",ord:0,sticky:false,rtl:false,font:"Arial",size:20},{name:"背面",ord:1,sticky:false,rtl:false,font:"Arial",size:20}], css:".card{font-family:arial;font-size:18px;text-align:left;color:black;background-color:white;padding:12px}", latexPre:"", latexPost:"", req:[[0,"all",[0]]] };
  const decks = { 1:{id:1,name:"Default",mod:sec,usn:-1,lrnToday:[0,0],revToday:[0,0],newToday:[0,0],timeToday:[0,0],conf:1,desc:"",dyn:0,collapsed:false,extendNew:10,extendRev:50} };
  decks[did] = { ...decks[1], id:did, name:"真题工坊·错题本" };
  const dconf = { 1:{id:1,name:"Default",mod:0,usn:0,maxTaken:60,autoplay:true,timer:0,replayq:true,new:{bury:true,delays:[1,10],initialFactor:2500,ints:[1,4,7],order:1,perDay:20,separate:true},rev:{bury:true,ease4:1.3,fuzz:0.05,ivlFct:1,maxIvl:36500,minSpace:1,perDay:100},lapse:{delays:[10],leechAction:0,leechFails:8,minInt:1,mult:0},dyn:false} };
  db.run("INSERT INTO col VALUES (1,?,?,?,11,0,0,0,?,?,?,?,?)", [sec, now, now, JSON.stringify(conf), JSON.stringify(models), JSON.stringify(decks), JSON.stringify(dconf), "{}"]);
  let id = now;
  for (const q of qs) {
    const front = `${q.stem}<br><br>A. ${q.opt_a}<br>B. ${q.opt_b}<br>C. ${q.opt_c}<br>D. ${q.opt_d}`;
    const back = `<b>答案：${q.answer}</b><br><br>${q.analysis}<br><br><i>考点：${q.knowledge_point}</i>`;
    const flds = front + "\x1f" + back;
    const csum = parseInt((await sha1hex(front)).slice(0, 8), 16);
    const nid = ++id;
    db.run("INSERT INTO notes VALUES (?,?,?,?,-1,'',?,?,?,0,'')", [nid, String(nid), mid, sec, flds, front.slice(0,100), csum]);
    db.run("INSERT INTO cards VALUES (?,?,?,0,?,-1,0,0,?,0,2500,0,0,0,0,0,0,'')", [++id, nid, did, sec, nid % 100000]);
  }
  const data = db.export();
  const zip = new JSZip();
  zip.file("collection.anki2", data);
  zip.file("media", "{}");
  const blob = await zip.generateAsync({ type: "blob" });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `真题工坊错题_${new Date().toISOString().slice(0,10)}.apkg`;
  a.click();
  toast('已下载 .apkg，可直接导入 Anki', true);
}

async function buy(plan) {
  try {
    const d = await api('/pay/create', { method: 'POST', body: JSON.stringify({ plan, channel: 'alipay' }) });
    location.href = d.pay_url;
  } catch (e) { toast(e.message); }
}
async function redeem() {
  try { const d = await api('/redeem', { method: 'POST', body: JSON.stringify({ code: $('#code').value }) }); toast('兑换成功，会员已开通', true); viewAccount(); }
  catch (e) { toast(e.message); }
}
function logout() { TOKEN = ''; ME = null; localStorage.removeItem('zt_token'); viewAuth(); }

// ---------- boot ----------
(async () => {
  if (TOKEN) { try { await loadMe(); viewHome(); return; } catch (e) { TOKEN=''; localStorage.removeItem('zt_token'); } }
  viewAuth();
})();
</script>
