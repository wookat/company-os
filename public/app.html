<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真题工坊 · 工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<style>
  body { font-family: "Inter","HarmonyOS Sans SC","PingFang SC","Noto Sans SC",system-ui,sans-serif; }
  .grad { background: linear-gradient(135deg,#4f46e5,#7c3aed); }
  .font-num { font-variant-numeric: tabular-nums; }
  .btn-press { transition: all .2s ease-out; }
  .btn-press:active { transform: scale(.98); }
  .card-hover { transition: all .2s ease-out; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgb(15 23 42 / .12); }
  .opt-btn { transition: all .15s ease-out; }
  .opt-btn:hover { border-color:#a5b4fc; background:#eef2ff66; }
  .opt-btn.sel { border-color:#4f46e5; background:#eef2ff99; box-shadow: 0 0 0 1px #4f46e5; }
  .opt-btn.sel .opt-badge { background:#4f46e5; color:#fff; border-color:transparent; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }
  #app > * { animation: fadeIn .15s ease-out; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
<div id="app" class="max-w-3xl mx-auto px-4 pb-24"></div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let TOKEN = localStorage.getItem('zt_token') || '';
let ME = null;

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  const r = await fetch('/api' + path, opts);
  const data = await r.json().catch(() => ({ error: '网络错误' }));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nav() {
  return `<header class="flex items-center justify-between py-5">
    <a href="/" class="font-bold text-lg">📝 真题工坊</a>
    <div class="flex items-center gap-3 text-sm">
      ${ME ? `<button onclick="viewHome()" class="text-slate-500 hover:text-indigo-600">工作台</button>
      <button onclick="viewWrong()" class="text-slate-500 hover:text-indigo-600">错题本</button>
      <button onclick="viewAccount()" class="text-slate-500 hover:text-indigo-600">${ME.pro ? '👑' : ''}我的</button>` : ''}
    </div></header>`;
}
// 答题页导航：离开前二次确认
function navExam() {
  return `<header class="flex items-center justify-between py-5">
    <button onclick="leaveExam(viewHome)" class="font-bold text-lg">📝 真题工坊</button>
    <div class="flex items-center gap-3 text-sm">
      <button onclick="leaveExam(viewHome)" class="text-slate-500 hover:text-indigo-600">工作台</button>
      <button onclick="leaveExam(viewWrong)" class="text-slate-500 hover:text-indigo-600">错题本</button>
      <button onclick="leaveExam(viewAccount)" class="text-slate-500 hover:text-indigo-600">我的</button>
    </div></header>`;
}
function toast(msg, ok=false) {
  const t = document.createElement('div');
  t.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl text-white text-sm shadow-lg z-50 ${ok?'bg-emerald-600':'bg-slate-800'}`;
  t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ---------- auth ----------
function viewAuth() {
  app.innerHTML = nav() + `
  <div class="max-w-sm mx-auto mt-10 bg-white rounded-2xl shadow-sm border border-slate-100 p-7">
    <h1 class="text-xl font-bold text-center" id="authTitle">登录真题工坊</h1>
    <div class="mt-5 space-y-3">
      <input id="email" type="email" placeholder="邮箱" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
      <input id="password" type="password" placeholder="密码（至少 6 位）" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
      <button id="authBtn" class="w-full py-3 rounded-xl grad text-white font-semibold">登录</button>
      <p class="text-center text-sm text-slate-500"><span id="switchHint">还没有账号？</span><button id="switchBtn" class="text-indigo-600 font-medium">注册</button></p>
    </div></div>`;
  let mode = 'login';
  $('#switchBtn').onclick = () => {
    mode = mode === 'login' ? 'register' : 'login';
    $('#authTitle').textContent = mode === 'login' ? '登录真题工坊' : '注册账号';
    $('#authBtn').textContent = mode === 'login' ? '登录' : '注册';
    $('#switchHint').textContent = mode === 'login' ? '还没有账号？' : '已有账号？';
    $('#switchBtn').textContent = mode === 'login' ? '注册' : '登录';
  };
  $('#authBtn').onclick = async () => {
    try {
      $('#authBtn').textContent = '请稍候…';
      const d = await api('/' + mode, { method: 'POST', body: JSON.stringify({ email: $('#email').value.trim(), password: $('#password').value }) });
      TOKEN = d.token; localStorage.setItem('zt_token', TOKEN);
      await loadMe(); viewHome();
    } catch (e) { toast(e.message); $('#authBtn').textContent = mode === 'login' ? '登录' : '注册'; }
  };
}
async function loadMe() { const d = await api('/me'); ME = { ...d.user, pro: d.pro, pay_enabled: d.pay_enabled }; }
function fmtDur(s) { s = s || 0; return `${Math.floor(s/60)} 分 ${s%60} 秒`; }

// ---------- home ----------
async function viewHome() {
  app.innerHTML = nav() + `<div class="text-center py-10 text-slate-400">加载中…</div>`;
  const [mats, papers] = await Promise.all([api('/materials'), api('/papers')]);
  app.innerHTML = nav() + `
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold">我的资料</h1>
    <button onclick="viewUpload()" class="px-4 py-2 rounded-xl grad text-white text-sm font-medium">+ 上传资料</button>
  </div>
  <div class="mt-4 space-y-3">${mats.materials.length ? mats.materials.map(m => `
    <div class="bg-white rounded-2xl border border-slate-100 p-4 flex items-center justify-between">
      <div><p class="font-medium">${esc(m.title)}</p><p class="text-xs text-slate-400 mt-0.5">${(m.size/1000).toFixed(1)}k 字 · ${m.created_at.slice(0,10)}</p></div>
      <button onclick="viewMaterial(${m.id})" class="px-3 py-1.5 rounded-lg bg-indigo-50 text-indigo-600 text-sm font-medium">出卷 →</button>
    </div>`).join('') : `<div class="bg-white rounded-2xl border border-dashed border-slate-200 p-10 text-center text-slate-400 text-sm">还没有资料。粘贴你的讲义/笔记，1 分钟得到一份仿真模拟卷。</div>`}</div>
  <h2 class="text-xl font-bold mt-8">我的试卷</h2>
  <div class="mt-4 space-y-3">${papers.papers.length ? papers.papers.map(pp => {
    const done = pp.last_total != null;
    const meta = pp.status==='ready'
      ? `${pp.question_count} 题 · ${done ? `已完成 ${pp.last_score}/${pp.last_total}` : '未作答'}`
      : pp.status==='generating' ? '⏳ 生成中（自动刷新）' : '生成失败';
    let action = `<span class="text-xs text-rose-500">失败</span>`;
    if (pp.status === 'ready') action = done
      ? `<div class="flex gap-2"><button onclick="viewResult(${pp.id})" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-medium">查看成绩</button><button onclick="retake(${pp.id})" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 text-sm">重做</button></div>`
      : `<button onclick="viewExam(${pp.id})" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-medium">开始答题</button>`;
    else if (pp.status === 'generating') action = `<div class="animate-spin w-5 h-5 border-2 border-indigo-200 border-t-indigo-600 rounded-full"></div>`;
    return `<div class="bg-white rounded-2xl border border-slate-100 p-4 flex items-center justify-between gap-3">
      <div class="min-w-0"><p class="font-medium truncate">${esc(pp.title)}</p><p class="text-xs text-slate-400 mt-0.5">${meta} · ${pp.created_at.slice(0,16)}</p></div>
      ${action}</div>`;
  }).join('') : `<div class="text-sm text-slate-400 py-4 text-center">暂无试卷</div>`}</div>`;
  // 生成中的试卷自动轮询
  clearTimeout(window.__homePoll);
  if (papers.papers.some(pp => pp.status === 'generating')) window.__homePoll = setTimeout(() => { if (document.body.contains(app)) viewHome(); }, 6000);
}
async function retake(pid) {
  if (!confirm('重新作答会覆盖这份试卷的最新成绩（历史记录仍会保留），确定吗？')) return;
  viewExam(pid, true);
}
async function viewResult(pid) {
  app.innerHTML = nav() + `<div class="text-center py-10 text-slate-400">加载中…</div>`;
  try { renderResult(await api(`/papers/${pid}/result`), pid); } catch (e) { toast(e.message); viewHome(); }
}

// ---------- upload ----------
function viewUpload() {
  app.innerHTML = nav() + `
  <h1 class="text-xl font-bold">上传复习资料</h1>
  <p class="text-sm text-slate-500 mt-1">上传 PDF / Word 文件，或直接粘贴讲义、笔记、教材节选（200 字以上）。AI 将自动抽取考点清单。</p>
  <label class="mt-4 flex flex-col items-center justify-center gap-1 py-6 rounded-2xl border-2 border-dashed border-slate-300 bg-white cursor-pointer hover:border-indigo-400">
    <span class="text-2xl">📄</span>
    <span class="text-sm font-medium text-indigo-600">选择 PDF / Word 文件</span>
    <span id="fileHint" class="text-xs text-slate-400">支持 .pdf、.docx，单份 10 万字以内</span>
    <input id="mfile" type="file" accept=".pdf,.docx" class="hidden">
  </label>
  <input id="mtitle" placeholder="资料标题，如：马原核心考点讲义" class="mt-4 w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
  <textarea id="mcontent" rows="14" placeholder="在此粘贴资料全文，或从上方选择文件自动导入…" class="mt-3 w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 text-sm"></textarea>
  <p id="charCount" class="mt-1 text-xs text-slate-400">0 字</p>
  <button id="upBtn" class="mt-3 w-full py-3.5 rounded-xl grad text-white font-semibold">上传并抽取考点（约 20 秒）</button>`;
  const cnt = () => { $('#charCount').textContent = `${$('#mcontent').value.length} 字`; };
  $('#mcontent').oninput = cnt;
  $('#mfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const hint = $('#fileHint');
    try {
      hint.textContent = `正在解析 ${f.name}…`;
      const text = await extractFileText(f);
      if (!text.trim()) throw new Error('未从文件中提取到文字（扫描件暂不支持，请粘贴文本）');
      $('#mcontent').value = text.slice(0, 100000); cnt();
      if (!$('#mtitle').value) $('#mtitle').value = f.name.replace(/\.(pdf|docx)$/i, '');
      hint.textContent = `已导入 ${f.name}（${text.length} 字）`;
    } catch (err) { hint.textContent = err.message; toast(err.message); }
  };
  $('#upBtn').onclick = async () => {
    try {
      $('#upBtn').textContent = '⏳ 正在抽取考点，请稍候…'; $('#upBtn').disabled = true;
      const d = await api('/materials', { method: 'POST', body: JSON.stringify({ title: $('#mtitle').value.trim(), content: $('#mcontent').value }) });
      toast('考点抽取完成', true); viewMaterial(d.id);
    } catch (e) { toast(e.message); $('#upBtn').textContent = '上传并抽取考点（约 20 秒）'; $('#upBtn').disabled = false; }
  };
}

// 文件文本抽取：PDF（pdf.js）/ Word（mammoth）
async function extractFileText(file) {
  const buf = await file.arrayBuffer();
  if (/\.pdf$/i.test(file.name)) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let out = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      out += tc.items.map(it => it.str).join(' ') + '\n\n';
      if (out.length > 100000) break;
    }
    return out;
  }
  if (/\.docx$/i.test(file.name)) return (await mammoth.extractRawText({ arrayBuffer: buf })).value;
  throw new Error('暂不支持该格式，请上传 PDF 或 .docx');
}

// ---------- material / generate ----------
async function viewMaterial(id) {
  app.innerHTML = nav() + `<div class="text-center py-10 text-slate-400">加载中…</div>`;
  const [d, cov] = await Promise.all([api('/materials/' + id), api(`/materials/${id}/coverage`).catch(() => null)]);
  app.innerHTML = nav() + `
  <h1 class="text-xl font-bold">${esc(d.material.title)}</h1>
  <p class="text-sm text-slate-500 mt-1">勾选本次要考的考点（默认全选），选择题量后生成。</p>
  ${cov ? `<div class="mt-3 bg-white rounded-2xl border border-slate-100 p-4">
    <div class="flex items-center justify-between text-sm"><span class="font-medium">累计考点覆盖</span><span class="text-slate-500">${cov.covered} / ${cov.total}</span></div>
    <div class="mt-2 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-indigo-500" style="width:${cov.total?cov.covered/cov.total*100:0}%"></div></div>
    ${cov.uncovered.length ? `<button onclick="selectUncovered()" class="mt-2 text-xs text-indigo-600">仅勾选尚未考过的 ${cov.uncovered.length} 个考点</button>` : '<p class="mt-2 text-xs text-emerald-600">全部考点已至少考过一次</p>'}
  </div>` : ''}
  <div class="mt-4 bg-white rounded-2xl border border-slate-100 p-4 space-y-1 max-h-96 overflow-y-auto">
    ${d.knowledge_points.map(k => `<label class="flex items-center gap-2 py-1.5 text-sm"><input type="checkbox" class="kp accent-indigo-600" value="${k.id}" data-name="${esc(k.name)}" checked><span>${esc(k.name)}</span><span class="text-xs text-slate-400">${esc(k.section||'')}</span></label>`).join('')}
  </div>
  <div class="mt-4 flex items-center gap-3">
    <select id="qcount" class="px-4 py-3 rounded-xl border border-slate-200 bg-white text-sm">
      <option value="10">10 题</option><option value="15">15 题${ME.pro?'':'（会员）'}</option><option value="20">20 题${ME.pro?'':'（会员）'}</option>
    </select>
    <button id="genBtn" class="flex-1 py-3 rounded-xl grad text-white font-semibold">生成仿真模拟卷</button>
  </div>
  <p class="text-xs text-slate-400 mt-2">生成含逐考点命题、查重与 AI 审校，约 1-2 分钟。免费版每天 1 份、最多 10 题。</p>`;
  window.__uncovered = cov ? cov.uncovered : [];
  $('#genBtn').onclick = async () => {
    const kp_ids = [...document.querySelectorAll('.kp:checked')].map(x => +x.value);
    const count = +$('#qcount').value;
    if (!ME.pro && count > 10) return toast('15/20 题为会员功能，请先升级');
    try {
      $('#genBtn').textContent = '⏳ 已提交，正在生成…'; $('#genBtn').disabled = true;
      const d2 = await api('/papers', { method: 'POST', body: JSON.stringify({ material_id: id, count, kp_ids }) });
      pollPaper(d2.id);
    } catch (e) { toast(e.message); $('#genBtn').textContent = '生成仿真模拟卷'; $('#genBtn').disabled = false; }
  };
}
async function pollPaper(pid) {
  const stages = ['逐考点定向命题', '与历史题库查重', 'AI 独立审校', '组卷与覆盖核算'];
  let stage = 0;
  const render = () => {
    app.innerHTML = nav() + `<div class="max-w-md mx-auto py-16 text-center">
      <div class="animate-spin w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full mx-auto"></div>
      <p class="mt-4 font-medium">正在生成仿真模拟卷</p>
      <div class="mt-5 space-y-2 text-left">${stages.map((s, j) => `
        <div class="flex items-center gap-3 px-4 py-2.5 rounded-xl ${j < stage ? 'bg-emerald-50 text-emerald-700' : j === stage ? 'bg-indigo-50 text-indigo-700' : 'bg-white text-slate-400'} text-sm border ${j === stage ? 'border-indigo-200' : 'border-transparent'}">
          <span>${j < stage ? '✓' : j === stage ? '⏳' : '○'}</span><span>${s}</span></div>`).join('')}</div>
      <p class="mt-4 text-xs text-slate-400">约 1-2 分钟。可以离开此页，生成完成后在工作台可直接开始答题。</p>
      <button onclick="clearInterval(window.__pollT);clearInterval(window.__stageT);viewHome()" class="mt-3 text-sm text-indigo-600">返回工作台</button></div>`;
  };
  render();
  clearInterval(window.__stageT);
  window.__stageT = setInterval(() => { if (stage < stages.length - 1) { stage++; render(); } }, 18000);
  clearInterval(window.__pollT);
  window.__pollT = setInterval(async () => {
    try {
      const d = await api('/papers/' + pid);
      if (d.paper.status === 'ready') { clearInterval(window.__pollT); clearInterval(window.__stageT); toast('试卷已就绪', true); viewExam(pid); }
      else if (d.paper.status === 'failed') { clearInterval(window.__pollT); clearInterval(window.__stageT); toast('生成失败，请重试'); viewHome(); }
    } catch (e) {}
  }, 5000);
}

function selectUncovered() {
  const set = new Set(window.__uncovered || []);
  document.querySelectorAll('.kp').forEach(x => { x.checked = set.has(x.dataset.name); });
  toast('已勾选未考过的考点', true);
}

// ---------- exam ----------
let EXAM = null;
async function viewExam(pid, retakeMode) {
  const d = await api('/papers/' + pid);
  if (d.paper.status !== 'ready') return pollPaper(pid);
  const saved = JSON.parse(localStorage.getItem('zt_exam_' + pid) || 'null');
  let answers = {}, start = Date.now();
  if (!retakeMode && saved && saved.answers && Object.keys(saved.answers).length && confirm('检测到上次未完成的作答进度，是否继续？')) {
    answers = saved.answers; start = Date.now() - (saved.elapsed || 0) * 1000;
  }
  EXAM = { pid, questions: d.questions, answers, start, retake: !!retakeMode };
  renderExam(0);
}
function saveProgress() {
  if (!EXAM) return;
  localStorage.setItem('zt_exam_' + EXAM.pid, JSON.stringify({ answers: EXAM.answers, elapsed: Math.floor((Date.now() - EXAM.start) / 1000) }));
}
function leaveExam(fn) {
  if (EXAM && Object.keys(EXAM.answers).length && !confirm('离开答题页？作答进度已自动保存，下次可继续。')) return;
  clearInterval(clockTimer); EXAM = null; document.onkeydown = null; fn();
}
function renderExam(i) {
  const qs = EXAM.questions, q = qs[i];
  const answered = Object.keys(EXAM.answers).length;
  app.innerHTML = navExam() + `
  <div class="flex items-center justify-between text-sm text-slate-500">
    <span>第 ${i+1} / ${qs.length} 题 · 已答 ${answered}</span><span id="clock" class="font-num px-2.5 py-1 rounded-full bg-white border border-slate-200 text-xs">⏱ --:--</span>
  </div>
  <div class="mt-2 h-1.5 rounded-full bg-slate-200 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 transition-[width] duration-300" style="width:${(i+1)/qs.length*100}%"></div></div>
  <div class="mt-3 bg-white rounded-2xl border border-slate-100 p-5">
    <p class="font-medium leading-relaxed text-[15px]">${esc(q.stem)}</p>
    <div class="mt-4 space-y-2">
      ${['a','b','c','d'].map(o => `<button data-opt="${o.toUpperCase()}" class="opt-btn group w-full flex items-start gap-3 text-left px-4 py-3 rounded-xl border border-slate-200 text-sm ${EXAM.answers[q.id]===o.toUpperCase()?'sel':''}"><span class="opt-badge grid h-7 w-7 shrink-0 place-items-center rounded-lg border border-slate-200 text-xs font-semibold text-slate-500">${o.toUpperCase()}</span><span class="pt-1">${esc(q['opt_'+o])}</span></button>`).join('')}
    </div>
  </div>
  <div class="mt-4 flex gap-3">
    <button ${i===0?'disabled':''} onclick="renderExam(${i-1})" class="px-5 py-3 rounded-xl bg-white border border-slate-200 text-sm disabled:opacity-40">上一题</button>
    ${i < qs.length-1 ? `<button onclick="renderExam(${i+1})" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white text-sm font-medium">下一题</button>`
      : `<button onclick="submitExam()" class="flex-1 py-3 rounded-xl grad text-white text-sm font-semibold">交卷（已答 ${answered}/${qs.length}）</button>`}
  </div>
  ${i === qs.length-1 ? '' : `<button onclick="submitExam()" class="mt-3 w-full py-2.5 rounded-xl bg-white border border-slate-200 text-sm text-slate-500">提前交卷（已答 ${answered}/${qs.length}）</button>`}
  <div class="mt-4 flex flex-wrap gap-1.5">${qs.map((qq,j) => `<button onclick="renderExam(${j})" class="w-9 h-9 rounded-lg text-xs ${EXAM.answers[qq.id]?'bg-indigo-600 text-white':'bg-white border border-slate-200 text-slate-500'} ${j===i?'ring-2 ring-indigo-400':''}">${j+1}</button>`).join('')}</div>
  <p class="mt-3 text-xs text-slate-400">选中后不会自动跳转，确认无误再点「下一题」。作答进度已自动保存。</p>`;
  document.querySelectorAll('.opt-btn').forEach(b => b.onclick = () => {
    EXAM.answers[q.id] = b.dataset.opt;
    saveProgress();
    renderExam(i);
  });
  document.onkeydown = e => {
    if (!EXAM) return;
    const k = e.key.toUpperCase();
    if (['A','B','C','D'].includes(k)) { EXAM.answers[q.id] = k; saveProgress(); renderExam(i); }
    else if (e.key === 'ArrowRight' && i < qs.length-1) renderExam(i+1);
    else if (e.key === 'ArrowLeft' && i > 0) renderExam(i-1);
  };
  updateClock();
}
let clockTimer = null;
function tickClock() {
  const s = Math.floor((Date.now() - EXAM.start) / 1000);
  const el = $('#clock'); if (el) el.textContent = `⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function updateClock() {
  clearInterval(clockTimer);
  tickClock();
  clockTimer = setInterval(tickClock, 1000);
}
async function submitExam() {
  const unanswered = EXAM.questions.length - Object.keys(EXAM.answers).length;
  if (unanswered > 0 && !confirm(`还有 ${unanswered} 题未作答，确定交卷？未作答题目计为错误但不进错题本。`)) return;
  clearInterval(clockTimer);
  try {
    const pid = EXAM.pid;
    const d = await api(`/papers/${pid}/submit`, { method: 'POST', body: JSON.stringify({ answers: EXAM.answers, duration_sec: Math.floor((Date.now()-EXAM.start)/1000), retake: EXAM.retake }) });
    localStorage.removeItem('zt_exam_' + pid);
    EXAM = null; document.onkeydown = null;
    renderResult(d, pid);
  } catch (e) { toast(e.message); updateClock(); }
}
function renderResult(d, pid) {
  const pct = Math.round(d.score / d.total * 100);
  const kpMap = {};
  d.detail.forEach(x => { kpMap[x.knowledge_point] = kpMap[x.knowledge_point] || { t:0, c:0 }; kpMap[x.knowledge_point].t++; if (x.correct) kpMap[x.knowledge_point].c++; });
  const weak = Object.entries(kpMap).filter(([,v]) => v.c < v.t).map(([k]) => k);
  const grade = pct >= 85 ? '冲刺状态拉满，保持节奏' : pct >= 60 ? `基础稳固，重点攻克 ${weak.length} 个薄弱考点` : `打基础期，锁定 ${weak.length} 个薄弱考点逐个拿下`;
  const R = 52, C = 2 * Math.PI * R;
  const ringColor = pct >= 85 ? '#10b981' : pct >= 60 ? '#4f46e5' : '#f59e0b';
  app.innerHTML = nav() + `
  <div class="text-center py-6">
    <div class="relative w-32 h-32 mx-auto">
      <svg viewBox="0 0 120 120" class="w-32 h-32 -rotate-90">
        <circle cx="60" cy="60" r="${R}" fill="none" stroke="#e2e8f0" stroke-width="10"/>
        <circle cx="60" cy="60" r="${R}" fill="none" stroke="${ringColor}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}"/>
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="text-3xl font-extrabold font-num">${d.score}<span class="text-base text-slate-400">/${d.total}</span></span>
      </div>
    </div>
    <p class="mt-3 text-sm font-medium text-slate-700">${grade}</p>
    <p class="text-sm text-slate-500 mt-1">正确率 ${pct}%${d.duration_sec ? ` · 用时 ${fmtDur(d.duration_sec)}` : ''} · 错题已自动加入错题本</p>
    <p class="text-xs text-slate-400 mt-1">本成绩已保存，可在工作台随时回看</p>
  </div>
  <h2 class="font-bold">考点覆盖度</h2>
  <div class="mt-2 bg-white rounded-2xl border border-slate-100 p-4 space-y-2">
    ${Object.entries(kpMap).map(([k,v]) => `<div class="flex items-center gap-2 text-sm"><span class="flex-1 truncate">${esc(k)}</span>
      <div class="w-28 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${v.c===v.t?'bg-emerald-500':v.c?'bg-amber-400':'bg-rose-400'}" style="width:${v.c/v.t*100}%"></div></div>
      <span class="text-xs text-slate-400 w-8 text-right">${v.c}/${v.t}</span></div>`).join('')}
  </div>
  <h2 class="font-bold mt-6">逐题解析 <span class="text-xs font-normal text-slate-400">答对的题默认折叠</span></h2>
  <div class="mt-2 space-y-3">${d.detail.map(x => `
    <details ${x.correct ? '' : 'open'} class="bg-white rounded-2xl border border-slate-100 overflow-hidden">
      <summary class="flex items-start gap-3 p-4 text-sm cursor-pointer">
        <span class="mt-0.5 w-1 self-stretch rounded-full ${x.correct?'bg-emerald-400':'bg-rose-400'}"></span>
        <span class="flex-1"><span class="font-medium">${x.seq}. ${esc(x.stem)}</span></span>
        <span class="shrink-0 text-xs px-2 py-0.5 rounded-full ${x.correct?'bg-emerald-50 text-emerald-600':'bg-rose-50 text-rose-600'}">${x.correct?'答对':'答错'}</span>
      </summary>
      <div class="px-4 pb-4 pl-8 text-sm">
        <p class="${x.correct?'text-emerald-600':'text-rose-500'}">${x.correct?'✓ 正确':'✗ 你的答案：'+esc(x.your||'未作答')} · 正确答案：${esc(x.answer)}</p>
        <p class="mt-1 text-xs text-indigo-600">考点：${esc(x.knowledge_point)}</p>
        <p class="mt-2 text-slate-500 leading-relaxed">${esc(x.analysis)}</p>
      </div>
    </details>`).join('')}</div>
  <div class="mt-6 flex gap-3">
    <button onclick="viewHome()" class="flex-1 py-3 rounded-xl bg-white border border-slate-200 text-sm">返回工作台</button>
    <button onclick="viewWrong()" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white text-sm font-medium">去看错题本</button>
  </div>`;
  window.scrollTo(0, 0);
}

  const d = await api('/wrongbook');
  app.innerHTML = nav() + `
  <div class="flex items-center justify-between">
    <h1 class="text-xl font-bold">错题本（${d.questions.length}）</h1>
    ${d.questions.length ? (ME.pro
      ? `<button onclick="exportApkg()" class="px-4 py-2 rounded-xl grad text-white text-sm font-medium">导出 Anki .apkg</button>`
      : `<button onclick="viewAccount()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-500 text-sm font-medium">🔒 导出 Anki（会员）</button>`) : ''}
  </div>
  <div class="mt-4 space-y-3">${d.questions.length ? d.questions.map(q => `
    <div class="bg-white rounded-2xl border border-slate-100 p-4 text-sm">
      <p class="font-medium">${esc(q.stem)}</p>
      <div class="mt-2 text-slate-500 space-y-0.5"><p>A. ${esc(q.opt_a)}</p><p>B. ${esc(q.opt_b)}</p><p>C. ${esc(q.opt_c)}</p><p>D. ${esc(q.opt_d)}</p></div>
      ${q.your_answer ? `<p class="mt-2 text-xs text-rose-500">你当时选了：${esc(q.your_answer)}</p>` : ''}
      <details class="mt-2"><summary class="text-indigo-600 cursor-pointer">查看答案与解析</summary>
        <p class="mt-1 text-emerald-600 font-medium">答案：${esc(q.answer)}</p><p class="mt-1 text-slate-500">${esc(q.analysis)}</p></details>
      <button onclick="removeWrong(${q.id})" class="mt-2 text-xs text-slate-400 hover:text-rose-500">移出错题本</button>
    </div>`).join('') : '<p class="text-center text-slate-400 py-10 text-sm">暂无错题，去做一份模拟卷吧</p>'}</div>`;
  window.WRONGQS = d.questions;
}
async function removeWrong(id) { await api('/wrongbook/' + id, { method: 'DELETE' }); viewWrong(); }

// ---------- Anki apkg export ----------
async function sha1hex(s) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function exportApkg() {
  if (!ME.pro) return toast('Anki 导出为会员功能，请在「我的」中升级');
  const qs = window.WRONGQS || [];
  if (!qs.length) return toast('错题本为空');
  toast('正在打包 .apkg…', true);
  const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
  const db = new SQL.Database();
  const now = Date.now(), sec = Math.floor(now / 1000);
  const mid = now, did = now + 1;
  db.run(`CREATE TABLE col (id integer primary key, crt integer, mod integer, scm integer, ver integer, dty integer, usn integer, ls integer, conf text, models text, decks text, dconf text, tags text);
  CREATE TABLE notes (id integer primary key, guid text, mid integer, mod integer, usn integer, tags text, flds text, sfld text, csum integer, flags integer, data text);
  CREATE TABLE cards (id integer primary key, nid integer, did integer, ord integer, mod integer, usn integer, type integer, queue integer, due integer, ivl integer, factor integer, reps integer, lapses integer, left integer, odue integer, odid integer, flags integer, data text);
  CREATE TABLE revlog (id integer primary key, cid integer, usn integer, ease integer, ivl integer, lastIvl integer, factor integer, time integer, type integer);
  CREATE TABLE graves (usn integer, oid integer, type integer);
  CREATE INDEX ix_notes_usn on notes (usn); CREATE INDEX ix_cards_usn on cards (usn);
  CREATE INDEX ix_revlog_usn on revlog (usn); CREATE INDEX ix_cards_nid on cards (nid);
  CREATE INDEX ix_cards_sched on cards (did, queue, due); CREATE INDEX ix_revlog_cid on revlog (cid);
  CREATE INDEX ix_notes_csum on notes (csum);`);
  const conf = { nextPos:1, estTimes:true, activeDecks:[1], sortType:"noteFld", timeLim:0, sortBackwards:false, addToCur:true, curDeck:1, newBury:true, newSpread:0, dueCounts:true, curModel:String(mid), collapseTime:1200 };
  const models = {}; models[mid] = { id:mid, name:"真题工坊错题", type:0, mod:sec, usn:-1, sortf:0, did, tmpls:[{name:"Card 1",ord:0,qfmt:"{{正面}}",afmt:"{{FrontSide}}<hr id=answer>{{背面}}",bqfmt:"",bafmt:"",did:null}], flds:[{name:"正面",ord:0,sticky:false,rtl:false,font:"Arial",size:20},{name:"背面",ord:1,sticky:false,rtl:false,font:"Arial",size:20}], css:".card{font-family:arial;font-size:18px;text-align:left;color:black;background-color:white;padding:12px}", latexPre:"", latexPost:"", req:[[0,"all",[0]]] };
  const decks = { 1:{id:1,name:"Default",mod:sec,usn:-1,lrnToday:[0,0],revToday:[0,0],newToday:[0,0],timeToday:[0,0],conf:1,desc:"",dyn:0,collapsed:false,extendNew:10,extendRev:50} };
  decks[did] = { ...decks[1], id:did, name:"真题工坊·错题本" };
  const dconf = { 1:{id:1,name:"Default",mod:0,usn:0,maxTaken:60,autoplay:true,timer:0,replayq:true,new:{bury:true,delays:[1,10],initialFactor:2500,ints:[1,4,7],order:1,perDay:20,separate:true},rev:{bury:true,ease4:1.3,fuzz:0.05,ivlFct:1,maxIvl:36500,minSpace:1,perDay:100},lapse:{delays:[10],leechAction:0,leechFails:8,minInt:1,mult:0},dyn:false} };
  db.run("INSERT INTO col VALUES (1,?,?,?,11,0,0,0,?,?,?,?,?)", [sec, now, now, JSON.stringify(conf), JSON.stringify(models), JSON.stringify(decks), JSON.stringify(dconf), "{}"]);
  let id = now;
  for (const q of qs) {
    const front = `${q.stem}<br><br>A. ${q.opt_a}<br>B. ${q.opt_b}<br>C. ${q.opt_c}<br>D. ${q.opt_d}`;
    const back = `<b>答案：${q.answer}</b><br><br>${q.analysis}<br><br><i>考点：${q.knowledge_point}</i>`;
    const flds = front + "\x1f" + back;
    const csum = parseInt((await sha1hex(front)).slice(0, 8), 16);
    const nid = ++id;
    db.run("INSERT INTO notes VALUES (?,?,?,?,-1,'',?,?,?,0,'')", [nid, String(nid), mid, sec, flds, front.slice(0,100), csum]);
    db.run("INSERT INTO cards VALUES (?,?,?,0,?,-1,0,0,?,0,2500,0,0,0,0,0,0,'')", [++id, nid, did, sec, nid % 100000]);
  }
  const data = db.export();
  const zip = new JSZip();
  zip.file("collection.anki2", data);
  zip.file("media", "{}");
  const blob = await zip.generateAsync({ type: "blob" });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `真题工坊错题_${new Date().toISOString().slice(0,10)}.apkg`;
  a.click();
  toast('已下载 .apkg，可直接导入 Anki', true);
}

async function buy(plan) {

    location.href = d.pay_url;
  } catch (e) { toast(e.message); }

async function redeem() {
  try { const d = await api('/redeem', { method: 'POST', body: JSON.stringify({ code: $('#code').value }) }); toast('兑换成功，会员已开通', true); viewAccount(); }
  catch (e) { toast(e.message); }

function logout() { TOKEN = ''; ME = null; localStorage.removeItem('zt_token'); viewAuth(); }

// ---------- boot ----------
(async () => {
  if (TOKEN) { try { await loadMe(); viewHome(); return; } catch (e) { TOKEN=''; localStorage.removeItem('zt_token'); } }
  viewAuth();
})();
