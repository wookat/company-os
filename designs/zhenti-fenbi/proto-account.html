<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>真题工坊 · 我的（重设计原型 · 对标粉笔）</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: {
  brand:{50:'#EEF4FF',100:'#DFEAFF',500:'#3D7FFF',600:'#2E6BEC',700:'#2456C7'},
  page:'#F4F6FA',
  ink:{DEFAULT:'#1E2330',2:'#5A6472',3:'#9AA3B2'},
  streak:'#FF7A2F', ok:'#00B578', bad:'#FF4D4F', warn:'#FFA716'
}}}}
</script>
<style>.card{box-shadow:0 1px 3px rgba(30,41,59,.06)}</style>
</head>
<body class="bg-page font-sans text-ink antialiased">

<header class="sticky top-0 z-40 h-14 bg-white/90 backdrop-blur border-b border-black/5">
  <div class="max-w-5xl mx-auto h-full px-4 sm:px-6 flex items-center gap-3">
    <span class="grid h-8 w-8 place-items-center rounded-lg bg-brand-500 text-white text-sm font-bold">真</span>
    <span class="font-bold">真题工坊</span>
    <nav class="ml-auto hidden sm:flex items-center gap-1 text-sm">
      <a class="px-3 py-1.5 rounded-lg text-ink-2 hover:bg-black/5">工作台</a>
      <a class="px-3 py-1.5 rounded-lg text-ink-2 hover:bg-black/5">错题本</a>
      <a class="px-3 py-1.5 rounded-lg bg-brand-50 text-brand-600 font-medium">我的</a>
    </nav>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 sm:px-6 py-5 sm:py-8 pb-24 sm:pb-10 space-y-4">

  <!-- 个人卡 -->
  <section class="card bg-white rounded-2xl border border-black/5 p-5 flex items-center gap-4">
    <span class="grid h-14 w-14 shrink-0 place-items-center rounded-full bg-brand-50 text-brand-600 text-xl font-bold">D</span>
    <div class="min-w-0 flex-1">
      <p class="font-semibold truncate">devin.ui.test0801@example.com</p>
      <p class="mt-1"><span class="inline-block px-2.5 py-0.5 rounded-full bg-page border border-black/5 text-xs text-ink-2">免费版 · 每天 1 份试卷 + 1 份 5 题快练</span></p>
    </div>
  </section>

  <!-- 邀请研友奖励卡 -->
  <section class="card rounded-2xl border border-black/5 bg-gradient-to-r from-brand-500 to-brand-600 text-white p-5">
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="font-bold">邀请研友，双方各得 3 天会员</p>
        <p class="mt-1 text-xs text-white/70">每邀请 1 位注册即生效，奖励上限 10 位 · 已邀请 <b class="tabular-nums">0</b>/10 · 你的邀请码：<b>Z22</b></p>
      </div>
      <span class="text-2xl">🎁</span>
    </div>
    <div class="mt-3 flex gap-2">
      <input readonly value="https://zhenti.zalize.com/app#reg-Z22" class="h-11 flex-1 min-w-0 rounded-xl bg-white/15 border border-white/20 px-3.5 text-sm text-white placeholder-white/50 outline-none">
      <button class="h-11 px-5 rounded-xl bg-white text-brand-600 text-sm font-semibold shrink-0">复制链接</button>
    </div>
  </section>

  <!-- 升级会员 -->
  <section class="card bg-white rounded-2xl border border-black/5 p-5">
    <h2 class="font-bold">升级会员</h2>
    <div class="mt-3 rounded-xl border border-warn/30 bg-gradient-to-r from-amber-50 to-orange-50 px-4 py-3 text-sm text-amber-800">
      内测期间全部功能免费，在线支付暂未开放。使用下方兑换码即可开通会员权益。
    </div>
    <div class="mt-3 flex gap-2">
      <input placeholder="输入兑换码" class="h-11 flex-1 min-w-0 rounded-xl border border-black/10 bg-white px-4 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100">
      <button class="h-11 px-6 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold shrink-0">兑换</button>
    </div>
    <p class="mt-2.5 text-xs text-ink-3">会员权益：不限量出卷 · 错题导出 Anki .apkg · 更多题型陆续开放</p>
  </section>

  <!-- 修改密码 -->
  <section class="card bg-white rounded-2xl border border-black/5 p-5">
    <h2 class="font-bold">修改密码</h2>
    <div class="mt-3 space-y-3">
      <label class="block">
        <span class="text-xs text-ink-3">当前密码</span>
        <input type="password" class="mt-1 h-11 w-full rounded-xl border border-black/10 bg-white px-4 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100">
      </label>
      <label class="block">
        <span class="text-xs text-ink-3">新密码（至少 6 位）</span>
        <input type="password" class="mt-1 h-11 w-full rounded-xl border border-black/10 bg-white px-4 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100">
      </label>
      <label class="block">
        <span class="text-xs text-ink-3">再次输入新密码</span>
        <input type="password" class="mt-1 h-11 w-full rounded-xl border border-black/10 bg-white px-4 text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100">
      </label>
      <button class="h-11 px-6 rounded-xl bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold">修改密码</button>
    </div>
  </section>

  <!-- 退出登录 -->
  <button class="card w-full h-12 rounded-2xl bg-white border border-black/5 text-bad text-sm font-medium hover:bg-bad/5">退出登录</button>
</main>

<!-- 移动端底部 Tab -->
<nav class="sm:hidden fixed bottom-0 inset-x-0 z-40 h-14 bg-white border-t border-black/5 grid grid-cols-3 text-[11px]">
  <a class="flex flex-col items-center justify-center gap-0.5 text-ink-3"><span class="text-lg leading-none">🏠</span>工作台</a>
  <a class="flex flex-col items-center justify-center gap-0.5 text-ink-3"><span class="text-lg leading-none">📕</span>错题本</a>
  <a class="flex flex-col items-center justify-center gap-0.5 text-brand-600 font-medium"><span class="text-lg leading-none">👤</span>我的</a>
</nav>
</body>
</html>
